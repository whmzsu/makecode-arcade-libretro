# libretro buildbot CI（不是给 GitLab 托管用的；官方会把这个仓库镜像到自己的
# GitLab，构建产物自动出现在 RetroArch 的 Core Downloader）
#
# 模板来源：libretro-infrastructure/ci-templates
# 约定：
#   CORENAME      —— 产物名 <CORENAME>_libretro.<ext>，须与 .info 的 systemid 对应
#   MAKEFILE      —— Makefile 文件名（模板的 script 用 -f ${MAKEFILE}）
#   MAKEFILE_PATH —— 仓库内 Makefile 所在目录（本仓库的 Makefile 在 core/）
#   JNI_PATH      —— 含 jni/ 的目录（android-jni 模板用）
#
# 产物落点：buildbot 只收仓库根的 <CORENAME>_libretro.<ext>。本仓库 Makefile
# 把 .so/.dll 放在 core/，所以每个桌面 job 的 after_script 都要搬到根目录
# （对照 bsnes 的 .core-defs-linux / -windows 写法），不能只 test -f 就结束。
#
# platform 必须显式注入：buildbot 模板只注入 CC/CXX/STRIP，不传 platform；
# 本仓库 Makefile 在 platform 为空时按 uname 探测，而 buildbot runner 是 Linux，
# Windows job 会误走 Unix 分支，拿 mingw 链 .so 时报 `unrecognized option -z`
# 直接红灯（实测）。对照 bsnes 的 .core-defs-windows 也显式给 platform。
#
# 收录原则：只列已验证能编过的平台。3DS/Vita 静态库已在 GitHub Actions 的
# devkitPro/vitaSDK 容器编译 + 真机验收（PATCH 16-20），故纳入 buildbot：
# 官方模板自己拉 RetroArch 源码，把静态库链成 .cia/.3dsx/.self。
# macOS 本地 zig 交叉已编出 dylib、符号干净（全是 libSystem 可解析），故接入；
# 但 buildbot 用真 clang + 10.9/10.15 目标，首轮官方跑通前仍是唯一未验点。
# iOS / 其余主机平台工具链未验证，暂不列，避免 CI 长期红灯。

.core-defs:
  variables:
    CORENAME: makecode_arcade
    MAKEFILE: Makefile
    MAKEFILE_PATH: core
    JNI_PATH: core

# 本仓库的 Makefile 把产物放在 core/，而 buildbot 收的是仓库根的同名文件。
.artifacts-dll:
  after_script:
    - mv ${MAKEFILE_PATH}/${CORENAME}_libretro.dll ${CORENAME}_libretro.dll
    - if [ "${STRIP_CORE_LIB:-1}" -eq 1 ]; then ${STRIP:-strip} --strip-unneeded ${CORENAME}_libretro.dll; fi

.artifacts-so:
  after_script:
    - mv ${MAKEFILE_PATH}/${CORENAME}_libretro.so ${CORENAME}_libretro.so
    - if [ "${STRIP_CORE_LIB:-1}" -eq 1 ]; then ${STRIP:-strip} --strip-unneeded ${CORENAME}_libretro.so; fi

include:
  # Windows x64 / x86 32 位（MinGW 交叉编译，产物 .dll）
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-i686-mingw.yml'

  # Linux x86_64 / aarch64 / x86 32 位（产物 .so）
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-i686.yml'

  # Android（ndk-build，走 core/jni/Android.mk + Application.mk）
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-jni.yml'

  # macOS x64（真 clang + 10.9 部署目标）/ arm64（Apple Silicon runner）
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-x64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-arm64.yml'

  # 3DS / Vita 静态链接（模板把 core/makecode_arcade_libretro_{ctr,vita}.a
  # 搬进官方 RetroArch 树，链成 .cia/.3dsx/.self 分发）
  - project: 'libretro-infrastructure/ci-templates'
    file: '/ctr-static.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/vita-static.yml'

stages:
  - build-prepare
  - build-shared
  - build-static

# ---------------------------------------------------------------- Windows
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs
    - .artifacts-dll
  variables:
    platform: win64
  script:
    - make -C ${MAKEFILE_PATH} -f ${MAKEFILE} -j${NUMPROC}
    # 防假绿（Supermodel 教训）：platform 不匹配时 make 会静默 exit 0，
    # 这里断言产物真的生成了
    - test -f ${MAKEFILE_PATH}/${CORENAME}_libretro.dll

libretro-build-windows-i686:
  extends:
    - .libretro-windows-i686-mingw-make-default
    - .core-defs
    - .artifacts-dll
  variables:
    platform: win32
  script:
    - make -C ${MAKEFILE_PATH} -f ${MAKEFILE} -j${NUMPROC}
    - test -f ${MAKEFILE_PATH}/${CORENAME}_libretro.dll

# ---------------------------------------------------------------- Linux
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs
    - .artifacts-so
  variables:
    platform: unix-x64
  script:
    - make -C ${MAKEFILE_PATH} -f ${MAKEFILE} -j${NUMPROC}
    - test -f ${MAKEFILE_PATH}/${CORENAME}_libretro.so

libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs
    - .artifacts-so
  variables:
    platform: unix-aarch64
  script:
    - make -C ${MAKEFILE_PATH} -f ${MAKEFILE} -j${NUMPROC}
    - test -f ${MAKEFILE_PATH}/${CORENAME}_libretro.so

libretro-build-linux-i686:
  extends:
    - .libretro-linux-i686-make-default
    - .core-defs
    - .artifacts-so
  variables:
    platform: unix-i686
  script:
    - make -C ${MAKEFILE_PATH} -f ${MAKEFILE} -j${NUMPROC}
    - test -f ${MAKEFILE_PATH}/${CORENAME}_libretro.so

# ---------------------------------------------------------------- Android
android-arm64-v8a:
  extends:
    - .libretro-android-jni-arm64-v8a
    - .core-defs

android-armeabi-v7a:
  extends:
    - .libretro-android-jni-armeabi-v7a
    - .core-defs

# ---------------------------------------------------------------- macOS
# 模板注入 platform=osx + CC/CXX=clang，产物 core/makecode_arcade_libretro.dylib，
# after_script 自动搬到根并 lipo 校验架构。.core-defs 的 MAKEFILE_PATH=core
# 覆盖模板默认 "."。x64 用 10.9 部署目标，arm64 用 Apple Silicon + 10.15。
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs

libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs

# ---------------------------------------------------------------- 3DS
# 静态模板：make platform=ctr → core/makecode_arcade_libretro_ctr.a →
# 搬进 RA 树 libretro_ctr.a → make -f Makefile.ctr 出 .cia/.3dsx。
# 注意模板默认 MAKEFILE_PATH=.，但我们 .core-defs 显式给 core（模板先
# extends、.core-defs 后 extends，后者覆盖），勿删。
libretro-build-ctr:
  extends:
    - .libretro-ctr-static-retroarch-master
    - .core-defs

# ---------------------------------------------------------------- Vita
# 静态模板：make platform=vita → core/makecode_arcade_libretro_vita.a →
# 搬进 RA 树 libretro_vita.a → make -f Makefile.vita 出 .self/.vitagl.self。
libretro-build-vita:
  extends:
    - .libretro-vita-static-retroarch-master
    - .core-defs

# 32 位口径（2026-11-19）：收录矩阵含 win-i686 / linux-i686 / android
# armeabi-v7a（发版 zip 另有 linux-armhf，buildbot 没有标准 armhf .so
# 模板所以不收录）。技术上 32 位已可用——A 方案 GC 旁路表进 main 后
# PXT64 布局在 32 位平台跑通，见 README「32 位与 64 位」与
# docs/PXT32-A-SCHEME.md。3DS / Vita 静态核心形态已真机验收（含 PATCH 16-20），
# 现已纳入本 buildbot 矩阵（上方两个 static job）。NX 线上游崩溃挂起
# （libretro/RetroArch#18905），暂不加入 libnx 模板避免分发坏包。
