# NX（Nintendo Switch）构建
#
# Switch 没有 dlopen：core 只能编成静态库，由 RetroArch 的 Makefile.libnx
# 连同前端一起链成 retroarch_switch.nro（一个 NRO 内含且仅含一个 core）。
# 因此这条线是两级构建：
#   core-libnx  make -C core platform=libnx        -> makecode_arcade_libretro_libnx.a
#   nro         把 .a 改名 libretro_libnx.a 放进 RetroArch 源码，make -f Makefile.libnx
#
# 与主 build.yml 分开：NRO 要拉 RetroArch 源码 + 装一堆 portlibs，耗时十几分钟，
# 不适合每次 push 都跑。触发方式有三种：
#   * push main（且改了 core/运行时）—— 回归，只出 artifact，不建 Release
#   * workflow_dispatch             —— 手动回归，同上
#   * push tag nx-v*                —— 发版，额外建 GitHub Release（见 release job）
#
# 为什么发版用独立的 nx-v* tag 而不是复用 core-v*：NRO 的产物形态与 6 个平台包
# 完全不同（它内含前端本体），两者构建耗时也差一个量级，绑在一起会拖慢每一次
# 核心发版。版本号仍与核心同步（nx-v0.3.3 ↔ core-v0.3.3）。
name: NX (Switch)

on:
  workflow_dispatch:
    inputs:
      retroarch_ref:
        description: "RetroArch tag/branch（留空用默认值）"
        required: false
        default: "v1.22.2"
  push:
    branches:
      - main
    # 发版 tag。注意 paths 过滤器对 tag push 不一定生效，所以 release-notes
    # 也列进来——每次发版必然新增该文件，保证 tag 一定能触发。
    tags:
      - "nx-v*"
    # 只在 core 侧或本 workflow 变动时跑（NRO 全量构建要十几分钟，
    # 不适合像 build.yml 那样每次 push 都跑）
    paths:
      - ".github/workflows/nx.yml"
      - ".github/release-notes/**"
      - "core/Makefile"
      - "core/sources.mk"   # 源文件清单唯一真源：加/删源文件只改这里
      - "core/src/**"
      - "runtime/**"
      - "tools/core.info.in"

concurrency:
  group: nx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------ 静态库
  core-libnx:
    name: core (.a / devkitA64)
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译静态库
        run: |
          set -u
          export PATH="${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin:${DEVKITPRO:-/opt/devkitpro}/tools/bin:$PATH"
          echo "DEVKITPRO=${DEVKITPRO:-<unset>}"
          log=/tmp/nx-build.log
          if ! make -C core platform=libnx -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::make 返回非零"
            # 关键行优先（截断超长的编译命令行，注解有长度限制）
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No such file|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            echo "::error::日志尾部（已滤掉编译命令行）："
            awk 'length($0) < 300' "$log" | tail -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -3 "$log"
          ls -l core/makecode_arcade_libretro_libnx.a

      - name: 校验 .a（架构 + retro_* 全局符号）
        run: |
          # GitHub 的默认 shell 是 bash -e，任何非零命令都会静默中断且只看得到
          # "exit code N"；而 job 日志要 admin 权限才能读。所以这里先 set +e，
          # 把整段校验放进子 shell，失败时把输出整段转成注解。
          set +e
          out=$(mktemp)
          (
            set -u
            # devkitPro 的 PATH 由 /etc/profile.d/devkit-env.sh 设置，非登录
            # shell（Actions 的 bash -e）拿不到，这里显式补上
            export PATH="${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin:${DEVKITPRO:-/opt/devkitpro}/tools/bin:$PATH"
            fail() { echo "FAIL: $*"; exit 1; }
            a=core/makecode_arcade_libretro_libnx.a
            [ -f "$a" ] || fail "没生成 $a"
            obj=$(aarch64-none-elf-ar t "$a" | head -1)
            [ -n "$obj" ] || fail "ar t 读不出成员"
            echo "首个成员: $obj"
            aarch64-none-elf-ar p "$a" "$obj" > /tmp/probe.o || fail "ar p 提取失败"
            aarch64-none-elf-readelf -h /tmp/probe.o | grep -E 'Class:|Machine:' || fail "readelf 失败"
            aarch64-none-elf-readelf -h /tmp/probe.o | grep -q 'AArch64' || fail "不是 AArch64 对象"
            # 对象数 vs 成员数：防止同名对象被 ar 覆盖（会静默丢符号）
            nobj=$(find core/build/make/libnx/obj -name '*.o' | wc -l | tr -d ' ')
            narm=$(aarch64-none-elf-ar t "$a" | wc -l | tr -d ' ')
            echo "对象 $nobj 个 / 归档成员 $narm 个"
            [ "$nobj" -eq "$narm" ] || fail "归档成员数($narm)与对象数($nobj)不一致：有同名成员被覆盖"
            n=$(aarch64-none-elf-nm --defined-only -g "$a" | grep -cE ' T retro_')
            echo "导出的 retro_* 全局符号: $n 个"
            [ "$n" -ge 20 ] || fail "retro_* 符号不足（$n）"
            for s in retro_init retro_run retro_load_game retro_set_environment; do
              aarch64-none-elf-nm --defined-only -g "$a" | grep -qE " T $s\$" || fail "缺 $s"
            done
            echo "校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -30 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -10 "$out"

      - name: 上传 .a
        uses: actions/upload-artifact@v4
        with:
          name: nx-core-libnx
          path: core/makecode_arcade_libretro_libnx.a
          if-no-files-found: error

  # ------------------------------------------------------------ NRO 打包
  nro:
    name: NRO (RetroArch + core)
    needs: core-libnx
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: 取回静态库
        uses: actions/download-artifact@v4
        with:
          name: nx-core-libnx
          path: /tmp/nx-core

      - name: 装 portlibs（RetroArch NX 的链接依赖）
        run: |
          set -u
          dkp-pacman -S --noconfirm --needed \
            switch-ffmpeg switch-libvpx switch-opus switch-libpng \
            switch-zlib switch-bzip2 switch-liblzma switch-libexpat \
            switch-mesa switch-libdrm_nouveau 2>&1 | tail -5
          # 镜像里不一定有 zip（打包用）
          command -v zip >/dev/null || { apt-get update -qq && apt-get install -y -qq zip; }

      - name: 拉 RetroArch 源码
        env:
          REF: ${{ github.event.inputs.retroarch_ref || 'v1.22.2' }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            echo "ref=$REF"
            command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
            rm -rf /tmp/ra
            git clone --depth 1 --branch "$REF" --recursive \
              https://github.com/libretro/RetroArch.git /tmp/ra || exit 1
            cd /tmp/ra && git log --oneline -1
            ls Makefile.libnx version.all >/dev/null || { echo "源码里没有 Makefile.libnx"; exit 1; }
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::拉源码失败（rc=$rc）"
            tail -25 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -5 "$out"

      - name: 链出 NRO
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export PATH="${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin:${DEVKITPRO:-/opt/devkitpro}/tools/bin:$PATH"
            cd /tmp/ra || exit 1
            # 官方约定：core 静态库必须以 libretro_libnx.a 的名字出现在源码根目录，
            # Makefile.libnx 会把它直接加进链接输入（OFILES += libretro_libnx.a）
            cp /tmp/nx-core/makecode_arcade_libretro_libnx.a libretro_libnx.a || exit 1
            make -f Makefile.libnx -j"$(nproc)" || exit 1
            ls -l retroarch_switch.nro || exit 1
            mkdir -p /tmp/pkg/core
            cp retroarch_switch.nro /tmp/pkg/core/makecode_arcade_libretro_libnx.nro
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::NRO 构建/链接失败（rc=$rc）"
            grep -E 'undefined reference|cannot find|error:|Error [0-9]|No rule|No such file' "$out" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            echo "::error::日志尾部（滤掉超长编译命令行）："
            awk 'length($0) < 300' "$out" | tail -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          ls -l /tmp/pkg/core/

      - name: 校验 NRO 里真的链进了本核心
        run: |
          # 链接成功 ≠ 核心被链进去（归档成员没被引用就会被丢掉）。用只属于
          # 本项目的符号做实证：retro_load_game / pxt_vm_start_buffer /
          # mca_tick_init 都是 extern "C"，RetroArch 自身不会定义它们。
          set +e
          out=$(mktemp)
          (
            set -u
            export PATH="${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin:${DEVKITPRO:-/opt/devkitpro}/tools/bin:$PATH"
            cd /tmp/ra || exit 1
            ls -l retroarch_switch.* 2>/dev/null
            elf=retroarch_switch.elf
            if [ -f "$elf" ]; then
              n=$(aarch64-none-elf-nm "$elf" | grep -cE ' T (retro_load_game|pxt_vm_start_buffer|mca_tick_init)$')
              echo "核心符号命中 $n / 3"
              aarch64-none-elf-nm "$elf" | grep -E ' T (retro_load_game|pxt_vm_start_buffer|mca_tick_init)$'
              [ "$n" -eq 3 ] || { echo "核心符号没全进 ELF：归档成员被链接器丢掉了"; exit 1; }
            else
              echo "没有 .elf，退回 NRO 字符串检查"
              grep -aq 'MakeCode Arcade' retroarch_switch.nro || { echo "NRO 里找不到核心字符串"; exit 1; }
            fi
            sz=$(stat -c %s retroarch_switch.nro)
            echo "NRO 大小: $sz 字节"
            [ "$sz" -gt 1000000 ] || { echo "NRO 太小，不像带前端+核心的完整包"; exit 1; }
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::NRO 内容校验失败（rc=$rc）"
            tail -25 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -8 "$out"

      - name: 打 zip（含 .info 与说明）
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            command -v zip >/dev/null || { apt-get update -qq && apt-get install -y -qq zip; }
            cd "$GITHUB_WORKSPACE" || exit 1
            # .info 与发版包用同一份模板，版本号取自源码 kCoreVersion（单点）
            VERSION=$(sed -n 's/.*kCoreVersion = "\([^"]*\)".*/\1/p' core/src/libretro_core.cpp | head -1)
            [ -n "$VERSION" ] || { echo "读不到 kCoreVersion"; exit 1; }
            echo "版本: $VERSION"
            mkdir -p /tmp/pkg
            sed "s|@VERSION@|$VERSION|" tools/core.info.in > /tmp/pkg/makecode_arcade_libretro.info || exit 1
            grep -E 'display_(name|version)' /tmp/pkg/makecode_arcade_libretro.info
            cp tools/nx-install-notes.txt /tmp/pkg/安装说明.txt || exit 1
            ls -l /tmp/pkg /tmp/pkg/core
            cd /tmp/pkg || exit 1
            rm -f makecode_arcade_switch.zip
            zip -q -r makecode_arcade_switch.zip core makecode_arcade_libretro.info 安装说明.txt || exit 1
            # 断言：zip 里必须真有 NRO（别发空包/只有说明的包）
            unzip -l makecode_arcade_switch.zip
            unzip -l makecode_arcade_switch.zip | grep -q '\.nro' || { echo "zip 里没有 .nro"; exit 1; }
            unzip -l makecode_arcade_switch.zip | grep -q '\.info' || { echo "zip 里没有 .info"; exit 1; }
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::打包失败（rc=$rc）"
            tail -25 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -12 "$out"

      - name: 上传 zip
        uses: actions/upload-artifact@v4
        with:
          name: nx-switch-nro
          path: /tmp/pkg/makecode_arcade_switch.zip
          if-no-files-found: error

  # ------------------------------------------------------------ 发版
  # 只在推 nx-v* tag 时跑。与 build.yml 的 release job 同一个思路：
  # 凭据用仓库内置 GITHUB_TOKEN（job 级 contents: write），不需要 PAT。
  #
  # 这里不做"发布前重新构建"的额外保险——nro job 已经断言过 NRO 里真的有
  # 本核心的符号（链接成功但核心被丢掉的情况会被拦住），产物可信。
  release:
    name: release (nx-v*)
    if: startsWith(github.ref, 'refs/tags/nx-v')
    needs: [nro]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nx-switch-nro
          path: pkg

      - name: 校验产物与 tag 一致
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            tag="${GITHUB_REF#refs/tags/}"
            ver="${tag#nx-v}"
            z=pkg/makecode_arcade_switch.zip
            [ -f "$z" ] || { echo "没有 artifact $z"; exit 1; }
            ls -l "$z"
            python3 -c "import sys,zipfile;n=zipfile.ZipFile(sys.argv[1]).namelist();print('  '+'\n  '.join(n))" "$z"
            # 包里必须真有 .nro 与 .info（只校验数量的老坑：发过只有调试符号的包）
            python3 -c "import sys,zipfile;n=zipfile.ZipFile(sys.argv[1]).namelist();ok=any(x.endswith('.nro') for x in n) and any(x.endswith('.info') for x in n);sys.exit(0 if ok else 'zip 内容不全: '+str(n))" "$z" \
              || { echo "zip 里缺 .nro 或 .info"; exit 1; }
            got=$(python3 -c "import sys,zipfile,re;d=zipfile.ZipFile(sys.argv[1]).read('makecode_arcade_libretro.info').decode();print(re.search(r'display_version = \"([^\"]+)\"',d).group(1))" "$z")
            echo ".info 版本: $got / tag 版本: $ver"
            [ "$got" = "$ver" ] || { echo ".info 版本 $got 与 tag $ver 不符"; exit 1; }
            notes=".github/release-notes/${tag}.md"
            [ -f "$notes" ] || { echo "缺少发版说明 $notes"; exit 1; }
            echo "发版说明: $notes"
            echo "校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::发版校验失败（rc=$rc）"
            tail -30 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -10 "$out"

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          title="nx ${tag#nx-} - Switch NRO (RetroArch + core)"
          notes=".github/release-notes/${tag}.md"
          # 幂等：重推 tag / 手动 rerun 时更新而不是报错（与 build.yml 的
          # release job 同一套写法）
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" pkg/makecode_arcade_switch.zip --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" pkg/makecode_arcade_switch.zip \
              --title "$title" --notes-file "$notes"
          fi
          gh release view "$tag" --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + "  " + (.size|tostring) + " B")'

      # 回填链接，方便在 Actions 里直接点开
      - name: 输出 Release 地址
        run: |
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF#refs/tags/}"
