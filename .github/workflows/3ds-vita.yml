# 3DS / Vita 静态 core 构建（发版形态：core 文件 + info）
#
# 与 NX 同理：3DS/Vita 没有 dlopen，core 只能编成静态库
#（libretro_ctr.a / libretro_vita.a），由 RetroArch 的 Makefile.ctr /
# Makefile.vita 连同前端一起链进 .cia / .self。
#
# 为什么放 CI 而不是本地 tool69：apt.devkitpro.org 在本机/工具机网络均被
# Cloudflare 403（2026-11-16 实测，换 UA 无效），devkitPro 工具链装不上；
# GitHub 的 runner 访问该源无限制，官方容器（devkitpro/devkitarm、
# devkitpro/vitasdk）里工具链是预置的。静态库正确性（SDK 头、ABI、
# pthread 头、platform hook 编入）只有真工具链能验证。
#
# 两个级别：core 静态库（core-ctr / core-vita）→ 链进 RetroArch 出核心
# 文件（ra-ctr 出 makecode_arcade_libretro.cia，ra-vita 出 makecode_arcade_libretro.self）+ info。
# 极简前端与核心 VPK 已不再构建/分发；RetroArch 版本 pin 见输入，与 nx.yml 一致。
#
# 发版触发：推 core-v* tag 时由 build.yml 通过 workflow_call 调用本 workflow，
# 产物 artifact（ctr-core-pack / vita-core-pack）交回 build.yml 的 release
# job 统一上传 Release。本 workflow 自己的 core-release-upload 只在
# workflow_dispatch + upload_tag 手动排障时用——被调用时跳过，避免双重上传。
name: 3DS/Vita static core

on:
  # build.yml 的 release job 在 core-v* tag 上调用本 workflow 构建，artifact
  # 交回那边的 release job 统一上传。github.ref 在 workflow_call 下继承调用
  # 方（即 tag），故 upload job 显式排除 workflow_call。
  workflow_call:
    inputs:
      retroarch_ref:
        description: "RetroArch tag/commit（留空用已验证的 tip 快照 d7cc9bc）"
        required: false
        type: string
        default: "d7cc9bc"
  workflow_dispatch:
    inputs:
      retroarch_ref:
        description: "RetroArch tag/commit（RA 完整前端两级构建用；留空用默认。注意：v1.22.2 的 Vita 路径用 vita2d，与新版 vitasdk GCC 硬冲突，3DS 路径强依赖 picasso（dkp-libs 无此包），默认用已验证的 tip 快照）"
        required: false
        default: "d7cc9bc"
      upload_tag:
        description: "把 core 文件和 info 上传到哪个 core-v* Release（如 core-v0.3.10；留空=不上传，只构建）"
        required: false
        default: ""

concurrency:
  group: 3dsvita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------ 3DS
  core-ctr:
    name: libretro_ctr.a (devkitARM / ARMv6k)
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译静态库
        run: |
          set -u
          # 容器里 DEVKITPRO 由 /etc/profile.d/devkit-env.sh 设置，非登录
          # shell（Actions 的 bash -e）拿不到，显式补上
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          arm-none-eabi-gcc --version | head -1
          log=/tmp/ctr-build.log
          if ! make -C core platform=ctr -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::make 返回非零"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No such file|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            echo "::error::日志尾部（已滤掉编译命令行）："
            awk 'length($0) < 300' "$log" | tail -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -3 "$log"
          ls -l core/makecode_arcade_libretro_ctr.a

      - name: 校验 .a（架构 + retro_* 符号 + 平台 hook 编入）
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
            export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
            fail() { echo "FAIL: $*"; exit 1; }
            a=core/makecode_arcade_libretro_ctr.a
            [ -f "$a" ] || fail "没生成 $a"
            obj=$(arm-none-eabi-ar t "$a" | head -1)
            [ -n "$obj" ] || fail "ar t 读不出成员"
            arm-none-eabi-ar p "$a" "$obj" > /tmp/probe.o || fail "ar p 提取失败"
            arm-none-eabi-readelf -h /tmp/probe.o | grep -E 'Class:|Machine:' || fail "readelf 失败"
            arm-none-eabi-readelf -h /tmp/probe.o | grep -q 'ARM' || fail "不是 ARM 对象"
            # 对象数 vs 成员数：防止同名对象被 ar 覆盖（会静默丢符号）
            nobj=$(find core/build/make/ctr/obj -name '*.o' | wc -l | tr -d ' ')
            narm=$(arm-none-eabi-ar t "$a" | wc -l | tr -d ' ')
            echo "对象 $nobj 个 / 归档成员 $narm 个"
            [ "$nobj" -eq "$narm" ] || fail "归档成员数($narm)与对象数($nobj)不一致：有同名成员被覆盖"
            n=$(arm-none-eabi-nm --defined-only -g "$a" | grep -cE ' T retro_')
            echo "导出的 retro_* 全局符号: $n 个"
            [ "$n" -ge 20 ] || fail "retro_* 符号不足（$n）"
            for s in retro_init retro_run retro_load_game retro_set_environment; do
              arm-none-eabi-nm --defined-only -g "$a" | grep -qE " T $s\$" || fail "缺 $s"
            done
            # 平台接入必须真编进去：hook 定义 + GC 堆注入函数（由 scheduler.cpp 提供）
            arm-none-eabi-nm --defined-only "$a" | grep -qE ' T mcaCtrInitGcHeap' \
              || fail "mcaCtrInitGcHeap 没编进去（platform_gc_heap_ctr.cpp 未生效）"
            arm-none-eabi-nm --defined-only "$a" | grep -qE ' T mca_vm_set_gc_heap' \
              || fail "mca_vm_set_gc_heap 没编进去（scheduler.cpp PXT32 分支未生效）"
            echo "平台 hook 校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -30 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -10 "$out"

      - name: 上传 .a
        uses: actions/upload-artifact@v4
        with:
          name: ctr-core-static
          path: core/makecode_arcade_libretro_ctr.a
          if-no-files-found: error

  # ------------------------------------------------------------ Vita
  core-vita:
    name: libretro_vita.a (vitaSDK / ARMv7-A + NEON)
    runs-on: ubuntu-24.04
    container:
      # 注意：vitaSDK 不归 devkitPro 发布，官方镜像是 vitasdk/vitasdk
      #（Docker Hub），镜像内已预置 VITASDK 与 PATH
      image: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译静态库
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          echo "VITASDK=$VITASDK"
          arm-vita-eabi-gcc --version | head -1
          log=/tmp/vita-build.log
          if ! make -C core platform=vita -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::make 返回非零"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No such file|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            echo "::error::日志尾部（已滤掉编译命令行）："
            awk 'length($0) < 300' "$log" | tail -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -3 "$log"
          ls -l core/makecode_arcade_libretro_vita.a

      - name: 校验 .a（架构 + retro_* 符号 + 平台 hook 编入）
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export VITASDK="${VITASDK:-/opt/vitasdk}"
            export PATH="$VITASDK/bin:$PATH"
            fail() { echo "FAIL: $*"; exit 1; }
            a=core/makecode_arcade_libretro_vita.a
            [ -f "$a" ] || fail "没生成 $a"
            obj=$(arm-vita-eabi-ar t "$a" | head -1)
            [ -n "$obj" ] || fail "ar t 读不出成员"
            arm-vita-eabi-ar p "$a" "$obj" > /tmp/probe.o || fail "ar p 提取失败"
            arm-vita-eabi-readelf -h /tmp/probe.o | grep -E 'Class:|Machine:' || fail "readelf 失败"
            arm-vita-eabi-readelf -h /tmp/probe.o | grep -q 'ARM' || fail "不是 ARM 对象"
            nobj=$(find core/build/make/vita/obj -name '*.o' | wc -l | tr -d ' ')
            narm=$(arm-vita-eabi-ar t "$a" | wc -l | tr -d ' ')
            echo "对象 $nobj 个 / 归档成员 $narm 个"
            [ "$nobj" -eq "$narm" ] || fail "归档成员数($narm)与对象数($nobj)不一致：有同名成员被覆盖"
            n=$(arm-vita-eabi-nm --defined-only -g "$a" | grep -cE ' T retro_')
            echo "导出的 retro_* 全局符号: $n 个"
            [ "$n" -ge 20 ] || fail "retro_* 符号不足（$n）"
            for s in retro_init retro_run retro_load_game retro_set_environment; do
              arm-vita-eabi-nm --defined-only "$a" | grep -qE " T $s\$" || fail "缺 $s"
            done
            arm-vita-eabi-nm --defined-only "$a" | grep -qE ' T mcaVitaInitGcHeap' \
              || fail "mcaVitaInitGcHeap 没编进去（platform_gc_heap_vita.cpp 未生效）"
            arm-vita-eabi-nm --defined-only "$a" | grep -qE ' T mca_vm_set_gc_heap' \
              || fail "mca_vm_set_gc_heap 没编进去（scheduler.cpp PXT32 分支未生效）"
            echo "平台 hook 校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -30 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -10 "$out"

      - name: 上传 .a
        uses: actions/upload-artifact@v4
        with:
          name: vita-core-static
          path: core/makecode_arcade_libretro_vita.a
          if-no-files-found: error

  # ============================================================ 3DS core CIA
  # 第二级构建：core 静态库链进 RetroArch（Makefile.ctr），再按官方
  # "每核心一个 CIA"的形态打包成 makecode_arcade_libretro.cia。链接只要 libctru，
  # 零新增依赖（CIA 打包用 RA 仓库自带的
  # pkg/ctr/tools/makerom-linux/bannertool-linux）。RetroArch 默认 pin
  # tip 快照 d7cc9bc（tool69 实测组合），原因见 workflow_dispatch 输入说明。
  ra-ctr:
    name: 3DS core CIA + info
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 core 静态库
        run: |
          set -u
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          log=/tmp/ctr-core.log
          if ! make -C core platform=ctr -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::core 构建失败"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find' "$log" \
              | head -15 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          ls -l core/makecode_arcade_libretro_ctr.a

      - name: 拉 RetroArch（pin ${{ inputs.retroarch_ref || 'd7cc9bc' }}）
        env:
          REF: ${{ inputs.retroarch_ref || 'd7cc9bc' }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -u
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          # REF 可为 tag 或 commit SHA。GitHub 不支持按 SHA fetch（
          # couldn't find remote ref，实测），走 codeload tarball：tag/SHA
          # 通吃、不需要子模块（ctr/vita 构建的依赖都在树内）。
          # 默认 d7cc9bc = tool69 实测通过组合：Vita 走 vitaGL（依赖链由
          # tools/setup_vita_gl_stack.sh 装）、3DS 有 prebuilt shader fallback。
          rm -rf /tmp/ra && mkdir -p /tmp/ra
          curl -fsSL "https://github.com/libretro/RetroArch/archive/${REF}.tar.gz" \
            | tar xz --strip-components=1 -C /tmp/ra
          head -3 /tmp/ra/Makefile.ctr /tmp/ra/Makefile.vita >/dev/null
          echo "RetroArch 树就绪"

      - name: 链 RA 3DS 完整前端（.3dsx + .cia）
        run: |
          set -u
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          # Makefile.ctr 除了 DEVKITPRO 还要求 DEVKITARM（缺了报
          # "recipe commences before first target" 的迷惑错误，tool69 实测）
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          # CIA 打包用 RA 仓库自带的 pkg/ctr/tools/makerom-linux/bannertool-linux
          cp core/makecode_arcade_libretro_ctr.a /tmp/ra/libretro_ctr.a
          log=/tmp/ra-ctr.log
          if ! make -f /tmp/ra/Makefile.ctr -C /tmp/ra -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::RA 3DS 链接失败"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          # 全量 make 若没带出 cia（部分版本 cia 是独立目标），补一刀
          make -f /tmp/ra/Makefile.ctr -C /tmp/ra retroarch_3ds.cia >> "$log" 2>&1 || true
          ls -l /tmp/ra/retroarch_3ds.3dsx /tmp/ra/retroarch_3ds.cia

      - name: 核心 CIA（官方"每核心一个 CIA"同构，定制身份）
        run: |
          set -u
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          cd /tmp/ra
          # RA 模板（pkg/ctr/tools/template.rsf）全参数化：APP_TITLE/
          # PRODUCT_CODE/UNIQUE_ID/ICON/BANNER 都是 make 变量。
          # 先删按 RA 默认值生成的 .bnr/.icn/.smdh/.cia——make 按 mtime
          # 跳过，不删则身份改动不生效（同 build_target.sh 的 mtime 坑）。
          # UniqueId 0xF1CA1 / CTR-P-MCA2：沿用已真机验收的身份（早期还有
          # 0xF1CA0 的极简包，现已不再分发，保留编号避免老用户装到半套）。
          rm -f retroarch_3ds.bnr retroarch_3ds.icn retroarch_3ds.smdh retroarch_3ds.cia
          make -f Makefile.ctr retroarch_3ds.cia \
            APP_TITLE="MakeCode Arcade" \
            APP_DESCRIPTION="MakeCode Arcade (RetroArch core)" \
            APP_AUTHOR="MCA (unofficial)" \
            APP_PRODUCT_CODE="CTR-P-MCA2" \
            APP_UNIQUE_ID=0xF1CA1 \
            APP_ICON="$GITHUB_WORKSPACE/core/assets/ctr/icon48.png" \
            APP_BANNER="$GITHUB_WORKSPACE/core/assets/ctr/banner256.png" \
            APP_AUDIO="$GITHUB_WORKSPACE/core/assets/ctr/banner.wav" \
            >> /tmp/ra-ctr.log 2>&1 || {
              echo "::error::核心 CIA 打包失败"
              tail -15 /tmp/ra-ctr.log | cut -c1-300 | sed 's/^/::error::  /'
              exit 1
            }
          cp retroarch_3ds.cia makecode_arcade_libretro.cia
          # info 与桌面包同源：core.info.in 模板 + kCoreVersion 版本号，
          # 文件名随核心文件名（RA 规则：info 与核心二进制同名）
          VERSION=$(sed -n 's/.*kCoreVersion = "\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/core/src/libretro_core.cpp" | head -1)
          [ -n "$VERSION" ] || { echo "::error::读不到 kCoreVersion"; exit 1; }
          sed "s|@VERSION@|$VERSION|" "$GITHUB_WORKSPACE/tools/core.info.in" > makecode_arcade_libretro.info
          grep -E 'display_(name|version)' makecode_arcade_libretro.info
          ls -l makecode_arcade_libretro.cia makecode_arcade_libretro.info

      - name: 校验 core 真链进 ELF
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
            export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
            cd /tmp/ra || exit 1
            fail() { echo "FAIL: $*"; exit 1; }
            n=$(arm-none-eabi-nm retroarch_3ds.elf 2>/dev/null | grep -cE ' T retro_')
            echo "retro_* T 符号: $n 个"
            [ "$n" -ge 100 ] || fail "retro_* 符号过少（$n）"
            for s in retro_load_game mcaCtrInitGcHeap; do
              arm-none-eabi-nm retroarch_3ds.elf | grep -qE " T $s\$" || fail "缺 $s"
            done
            echo "core 符号校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -20 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -5 "$out"

      - name: 上传 3DS core 文件 + info
        uses: actions/upload-artifact@v4
        with:
          name: ctr-core-pack
          path: |
            /tmp/ra/makecode_arcade_libretro.cia
            /tmp/ra/makecode_arcade_libretro.info
          if-no-files-found: error

  # ============================================================ Vita core SELF
  # 第二级构建：Makefile.vita 默认走 vitaGL 路径，需要 5 个
  # 额外依赖库（taiHEN -> SceShaccCgExt -> vitashark -> math-neon ->
  # vitaGL），由 tools/setup_vita_gl_stack.sh 固化（tool69 同配方）。
  # 产物：makecode_arcade_libretro.self（并入用户已装的 RetroArch）+ makecode_arcade_libretro.info。
  # 核心 VPK 与极简前端均已不再构建/分发。
  ra-vita:
    name: Vita core SELF + info
    runs-on: ubuntu-24.04
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 vitaGL 依赖链（tools/setup_vita_gl_stack.sh）
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          arm-vita-eabi-gcc --version | head -1
          command -v cmake >/dev/null || { apt-get update -qq && apt-get install -y -qq cmake; }
          command -v git   >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          sh tools/setup_vita_gl_stack.sh

      - name: 编译 core 静态库
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          log=/tmp/vita-core.log
          if ! make -C core platform=vita -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::core 构建失败"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find' "$log" \
              | head -15 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          ls -l core/makecode_arcade_libretro_vita.a

      - name: 拉 RetroArch（pin ${{ inputs.retroarch_ref || 'd7cc9bc' }}）
        env:
          REF: ${{ inputs.retroarch_ref || 'd7cc9bc' }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -u
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          # REF 可为 tag 或 commit SHA；GitHub 不支持按 SHA fetch（实测），
          # 走 codeload tarball（依赖都在树内，不需要子模块）
          rm -rf /tmp/ra && mkdir -p /tmp/ra
          curl -fsSL "https://github.com/libretro/RetroArch/archive/${REF}.tar.gz" \
            | tar xz --strip-components=1 -C /tmp/ra
          head -3 /tmp/ra/Makefile.ctr /tmp/ra/Makefile.vita >/dev/null
          echo "RetroArch 树就绪"

      - name: 链 RA Vita 完整前端（.self）
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          cp core/makecode_arcade_libretro_vita.a /tmp/ra/libretro_vita.a
          log=/tmp/ra-vita.log
          if ! make -f /tmp/ra/Makefile.vita -C /tmp/ra retroarch_vita.self -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::RA Vita 链接失败"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          ls -l /tmp/ra/retroarch_vita.self

      - name: 出核心 SELF + info
        run: |
          set -u
          cd /tmp/ra || exit 1
          cp retroarch_vita.self makecode_arcade_libretro.self
          # info 与桌面包同源（同 ra-ctr，见那里的注释）
          VERSION=$(sed -n 's/.*kCoreVersion = "\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/core/src/libretro_core.cpp" | head -1)
          [ -n "$VERSION" ] || { echo "::error::读不到 kCoreVersion"; exit 1; }
          sed "s|@VERSION@|$VERSION|" "$GITHUB_WORKSPACE/tools/core.info.in" > makecode_arcade_libretro.info
          grep -E 'display_(name|version)' makecode_arcade_libretro.info
          ls -l makecode_arcade_libretro.self makecode_arcade_libretro.info

      - name: 校验 core SELF + info
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export VITASDK="${VITASDK:-/opt/vitasdk}"
            export PATH="$VITASDK/bin:$PATH"
            cd /tmp/ra || exit 1
            fail() { echo "FAIL: $*"; exit 1; }
            # 核心 SELF 必须带 fSELF 头（SCE\0）：RA 靠 exec 加载，裸 ELF 起不来。
            # dash 的 printf 不认 \xHH，用八进制 \000。
            head -c 4 makecode_arcade_libretro.self > /tmp/self-head
            printf 'SCE\000' > /tmp/sce-magic
            cmp -s /tmp/sce-magic /tmp/self-head \
              || { od -An -tx1 -N8 makecode_arcade_libretro.self; fail "SELF 头不是 fSELF（SCE\\0）"; }
            echo "makecode_arcade_libretro.self: $(stat -c %s makecode_arcade_libretro.self) B, fSELF 头正确"
            grep -q 'supported_extensions = "pxt64"' makecode_arcade_libretro.info \
              || fail "info 里 supported_extensions 不是 pxt64"
            grep -q 'display_name = "MakeCode Arcade (unofficial)"' makecode_arcade_libretro.info \
              || fail "info 缺 display_name"
            VER=$(sed -n 's/.*kCoreVersion = "\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/core/src/libretro_core.cpp" | head -1)
            [ -n "$VER" ] || fail "读不到 kCoreVersion"
            grep -q "display_version = \"$VER\"" makecode_arcade_libretro.info \
              || fail "info display_version 与 kCoreVersion($VER) 不符"
            n=$(arm-vita-eabi-nm retroarch_vita.elf.unstripped.elf 2>/dev/null | grep -cE ' T retro_')
            echo "retro_* T 符号: $n 个"
            [ "$n" -ge 100 ] || fail "retro_* 符号过少（$n）"
            for s in retro_load_game mcaVitaInitGcHeap; do
              arm-vita-eabi-nm retroarch_vita.elf.unstripped.elf | grep -qE " T $s\$" || fail "缺 $s"
            done
            echo "核心文件校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -25 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -6 "$out"

      - name: 上传 Vita core 文件 + info
        uses: actions/upload-artifact@v4
        with:
          name: vita-core-pack
          path: |
            /tmp/ra/makecode_arcade_libretro.self
            /tmp/ra/makecode_arcade_libretro.info
          if-no-files-found: error

  # ============================================================ 手动补传
  # 仅供手动排障：把已构建的 3DS/Vita core 文件 + info 补传到指定 Release。
  # 正常发版由 build.yml 通过 workflow_call 调用、产物交回那边统一上传，
  # 故 workflow_call 下跳过，避免与 build.yml 双重上传。
  core-release-upload:
    name: upload 3DS/Vita core files + info (manual)
    needs: [ra-ctr, ra-vita]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.upload_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: 归集资产
        run: |
          set -euo pipefail
          mkdir -p pkg
          # 3DS：核心 CIA（内含 RA 前端本体，装进 sdmc:/retroarch/cores/）
          cp art/ctr-core-pack/makecode_arcade_libretro.cia pkg/
          # Vita：裸 SELF（并进已装 RetroArch 的目录）
          cp art/vita-core-pack/makecode_arcade_libretro.self pkg/
          # info 内容跨平台通用，只上传一份（文件名与两个 core 都同名）
          cp art/ctr-core-pack/makecode_arcade_libretro.info pkg/
          ls -l pkg/

      - name: 轮询等待 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.upload_tag }}" ]; then
            tag="${{ inputs.upload_tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "目标 Release: $tag"
          # 轮询：build.yml 的 release job 要等 zig/android/lakka 全编完才建
          # Release，慢时几十分钟。60 分钟内出现即可；超时则红——确认主
          # 流水线没挂后重跑本 job 即可，上传幂等（--clobber）。
          for i in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release 已存在（第 $i 次检查）"
              break
            fi
            echo "等待 Release 建立… ($i/60)"
            sleep 60
          done
          gh release view "$tag" >/dev/null 2>&1 || {
            echo "::error::60 分钟内 Release $tag 未建立（build.yml 的 release job 可能失败了），确认后重跑本 job"
            exit 1
          }
          gh release upload "$tag" pkg/* --clobber
          echo "== Release 资产 =="
          gh release view "$tag" --json assets --jq '.assets[] | "  " + .name + "  " + (.size|tostring) + " B"'
