# 3DS / Vita 静态库实编（probe/pxt32-3ds-vita 分支探索线）
#
# 与 NX 同理：3DS/Vita 没有 dlopen，core 只能编成静态库
#（libretro_ctr.a / libretro_vita.a），由 RetroArch 的 Makefile.ctr /
# Makefile.vita 连同前端一起链进 .3dsx/.cia / .vpk。
#
# 为什么放 CI 而不是本地 tool69：apt.devkitpro.org 在本机/工具机网络均被
# Cloudflare 403（2026-11-16 实测，换 UA 无效），devkitPro 工具链装不上；
# GitHub 的 runner 访问该源无限制，官方容器（devkitpro/devkitarm、
# devkitpro/vitasdk）里工具链是预置的。静态库正确性（SDK 头、ABI、
# pthread 头、platform hook 编入）只有真工具链能验证。
#
# 只做手动触发（workflow_dispatch）：本分支不进常规 CI，按需实编。
# 两级构建都在：第一级（core 静态库 + 最小前端），第二级（core 静态库链进
# RetroArch 完整前端，ra-ctr / ra-vita 两个 job，RetroArch 版本 pin 见
# workflow_dispatch 输入，与 nx.yml 一致）。
name: 3DS/Vita static core

on:
  workflow_dispatch:
    inputs:
      retroarch_ref:
        description: "RetroArch tag/commit（RA 完整前端两级构建用；留空用默认。注意：v1.22.2 的 Vita 路径用 vita2d，与新版 vitasdk GCC 硬冲突，3DS 路径强依赖 picasso（dkp-libs 无此包），默认用已验证的 tip 快照）"
        required: false
        default: "d7cc9bc"
      upload_tag:
        description: "把前端整包上传到哪个 core-v* Release（如 core-v0.3.10；留空=不上传，只构建）"
        required: false
        default: ""
  push:
    tags:
      # 与 build.yml 的 release job 同一个 tag：本 workflow 出 3DS/Vita 前端
      # 整包并追加到同一个 Release（frontend-release job 轮询等 Release 建好
      # 再上传）。注意本 workflow 没有 paths 过滤，tag push 必触发。
      - "core-v*"

concurrency:
  group: 3dsvita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------ 3DS
  core-ctr:
    name: libretro_ctr.a (devkitARM / ARMv6k)
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译静态库
        run: |
          set -u
          # 容器里 DEVKITPRO 由 /etc/profile.d/devkit-env.sh 设置，非登录
          # shell（Actions 的 bash -e）拿不到，显式补上
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          arm-none-eabi-gcc --version | head -1
          log=/tmp/ctr-build.log
          if ! make -C core platform=ctr -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::make 返回非零"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No such file|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            echo "::error::日志尾部（已滤掉编译命令行）："
            awk 'length($0) < 300' "$log" | tail -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -3 "$log"
          ls -l core/makecode_arcade_libretro_ctr.a

      - name: 校验 .a（架构 + retro_* 符号 + 平台 hook 编入）
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
            export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
            fail() { echo "FAIL: $*"; exit 1; }
            a=core/makecode_arcade_libretro_ctr.a
            [ -f "$a" ] || fail "没生成 $a"
            obj=$(arm-none-eabi-ar t "$a" | head -1)
            [ -n "$obj" ] || fail "ar t 读不出成员"
            arm-none-eabi-ar p "$a" "$obj" > /tmp/probe.o || fail "ar p 提取失败"
            arm-none-eabi-readelf -h /tmp/probe.o | grep -E 'Class:|Machine:' || fail "readelf 失败"
            arm-none-eabi-readelf -h /tmp/probe.o | grep -q 'ARM' || fail "不是 ARM 对象"
            # 对象数 vs 成员数：防止同名对象被 ar 覆盖（会静默丢符号）
            nobj=$(find core/build/make/ctr/obj -name '*.o' | wc -l | tr -d ' ')
            narm=$(arm-none-eabi-ar t "$a" | wc -l | tr -d ' ')
            echo "对象 $nobj 个 / 归档成员 $narm 个"
            [ "$nobj" -eq "$narm" ] || fail "归档成员数($narm)与对象数($nobj)不一致：有同名成员被覆盖"
            n=$(arm-none-eabi-nm --defined-only -g "$a" | grep -cE ' T retro_')
            echo "导出的 retro_* 全局符号: $n 个"
            [ "$n" -ge 20 ] || fail "retro_* 符号不足（$n）"
            for s in retro_init retro_run retro_load_game retro_set_environment; do
              arm-none-eabi-nm --defined-only -g "$a" | grep -qE " T $s\$" || fail "缺 $s"
            done
            # 平台接入必须真编进去：hook 定义 + GC 堆注入函数（由 scheduler.cpp 提供）
            arm-none-eabi-nm --defined-only "$a" | grep -qE ' T mcaCtrInitGcHeap' \
              || fail "mcaCtrInitGcHeap 没编进去（platform_gc_heap_ctr.cpp 未生效）"
            arm-none-eabi-nm --defined-only "$a" | grep -qE ' T mca_vm_set_gc_heap' \
              || fail "mca_vm_set_gc_heap 没编进去（scheduler.cpp PXT32 分支未生效）"
            echo "平台 hook 校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -30 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -10 "$out"

      - name: 编译前端（最小 libretro 前端，.3dsx + .cia）
        run: |
          set -u
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
          # makerom/bannertool 不在 devkitPro pacman 源（dkp-pacman 报
          # target not found，2026-11-17 实测），按社区惯例从 GitHub release 取
          mkdir -p /tmp/ciatools && cd /tmp/ciatools
          curl -fsSL -o makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -o makerom.zip -d makerom
          install -m 755 makerom/makerom "$DEVKITPRO/tools/bin/makerom"
          # bannertool 原仓库 Steveice10/bannertool 已 404（2026-11-17 实测），
          # diasurgical fork 保留同名 release 资产（zip 内 linux-x86_64/bannertool）
          curl -fsSL -o bannertool.zip \
            https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -o bannertool.zip -d bannertool
          install -m 755 bannertool/linux-x86_64/bannertool "$DEVKITPRO/tools/bin/bannertool"
          makerom -h 2>&1 | head -2 || true
          cd "$GITHUB_WORKSPACE"
          log=/tmp/ctr-fe.log
          if ! make -C frontends/ctr all cia > "$log" 2>&1; then
            echo "::error::前端构建失败"
            tail -30 "$log" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -5 "$log"
          ls -l frontends/ctr/mca_ctr.3dsx frontends/ctr/mca_ctr.cia

      - name: 上传 .a
        uses: actions/upload-artifact@v4
        with:
          name: ctr-core-static
          path: core/makecode_arcade_libretro_ctr.a
          if-no-files-found: error

      - name: 上传 3DS 测试包（3dsx + cia）
        uses: actions/upload-artifact@v4
        with:
          name: ctr-testpack
          path: |
            frontends/ctr/mca_ctr.3dsx
            frontends/ctr/mca_ctr.cia
          if-no-files-found: error

  # ------------------------------------------------------------ Vita
  core-vita:
    name: libretro_vita.a (vitaSDK / ARMv7-A + NEON)
    runs-on: ubuntu-24.04
    container:
      # 注意：vitaSDK 不归 devkitPro 发布，官方镜像是 vitasdk/vitasdk
      #（Docker Hub），镜像内已预置 VITASDK 与 PATH
      image: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译静态库
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          echo "VITASDK=$VITASDK"
          arm-vita-eabi-gcc --version | head -1
          log=/tmp/vita-build.log
          if ! make -C core platform=vita -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::make 返回非零"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No such file|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            echo "::error::日志尾部（已滤掉编译命令行）："
            awk 'length($0) < 300' "$log" | tail -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -3 "$log"
          ls -l core/makecode_arcade_libretro_vita.a

      - name: 校验 .a（架构 + retro_* 符号 + 平台 hook 编入）
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export VITASDK="${VITASDK:-/opt/vitasdk}"
            export PATH="$VITASDK/bin:$PATH"
            fail() { echo "FAIL: $*"; exit 1; }
            a=core/makecode_arcade_libretro_vita.a
            [ -f "$a" ] || fail "没生成 $a"
            obj=$(arm-vita-eabi-ar t "$a" | head -1)
            [ -n "$obj" ] || fail "ar t 读不出成员"
            arm-vita-eabi-ar p "$a" "$obj" > /tmp/probe.o || fail "ar p 提取失败"
            arm-vita-eabi-readelf -h /tmp/probe.o | grep -E 'Class:|Machine:' || fail "readelf 失败"
            arm-vita-eabi-readelf -h /tmp/probe.o | grep -q 'ARM' || fail "不是 ARM 对象"
            nobj=$(find core/build/make/vita/obj -name '*.o' | wc -l | tr -d ' ')
            narm=$(arm-vita-eabi-ar t "$a" | wc -l | tr -d ' ')
            echo "对象 $nobj 个 / 归档成员 $narm 个"
            [ "$nobj" -eq "$narm" ] || fail "归档成员数($narm)与对象数($nobj)不一致：有同名成员被覆盖"
            n=$(arm-vita-eabi-nm --defined-only -g "$a" | grep -cE ' T retro_')
            echo "导出的 retro_* 全局符号: $n 个"
            [ "$n" -ge 20 ] || fail "retro_* 符号不足（$n）"
            for s in retro_init retro_run retro_load_game retro_set_environment; do
              arm-vita-eabi-nm --defined-only "$a" | grep -qE " T $s\$" || fail "缺 $s"
            done
            arm-vita-eabi-nm --defined-only "$a" | grep -qE ' T mcaVitaInitGcHeap' \
              || fail "mcaVitaInitGcHeap 没编进去（platform_gc_heap_vita.cpp 未生效）"
            arm-vita-eabi-nm --defined-only "$a" | grep -qE ' T mca_vm_set_gc_heap' \
              || fail "mca_vm_set_gc_heap 没编进去（scheduler.cpp PXT32 分支未生效）"
            echo "平台 hook 校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -30 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -10 "$out"

      - name: 编译前端（最小 libretro 前端，.vpk）
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          log=/tmp/vita-fe.log
          if ! make -C frontends/vita > "$log" 2>&1; then
            echo "::error::前端构建失败"
            grep -nE 'error:|undefined reference|cannot find|No such file|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            echo "::error::日志尾部："
            awk 'length($0) < 300' "$log" | tail -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -5 "$log"
          ls -l frontends/vita/mca_vita.vpk

      - name: 校验测试包 vpk（eboot fSELF / icon0 / TITLE_ID）
        run: |
          set -euo pipefail
          vpk=frontends/vita/mca_vita.vpk
          fail() { echo "::error::$1"; exit 1; }
          unzip -l "$vpk" | grep -q 'sce_sys/param.sfo' || fail "vpk 缺 param.sfo"
          unzip -l "$vpk" | grep -q 'sce_sys/icon0.png'  || fail "vpk 缺 icon0"
          # eboot 必须是 fSELF（SCE\x00 头）。血泪：-b 直接塞 .velf（\x7FELF）
          # 的包 VitaShell 装不上。
          unzip -p "$vpk" eboot.bin > /tmp/eboot.bin
          printf 'SCE\x00' > /tmp/sce-magic
          head -c 4 /tmp/eboot.bin > /tmp/eboot-head
          cmp -s /tmp/sce-magic /tmp/eboot-head \
            || { od -An -tx1 -N8 /tmp/eboot.bin; fail "eboot.bin 头不是 fSELF（SCE\\x00）"; }
          echo "eboot.bin: $(stat -c %s /tmp/eboot.bin) B, fSELF 头正确"
          unzip -p "$vpk" sce_sys/param.sfo | grep -aq MCAV00001 \
            || fail "param.sfo TITLE_ID 不是 MCAV00001"

      - name: 上传 .a
        uses: actions/upload-artifact@v4
        with:
          name: vita-core-static
          path: core/makecode_arcade_libretro_vita.a
          if-no-files-found: error

      - name: 上传 Vita 测试包（vpk）
        uses: actions/upload-artifact@v4
        with:
          name: vita-testpack
          path: frontends/vita/mca_vita.vpk
          if-no-files-found: error

  # ============================================================ RA 完整前端（3DS）
  # 第二级构建：core 静态库链进 RetroArch（Makefile.ctr），出带完整
  # XMB 菜单前端的 .3dsx/.cia——与官方"每核心一个分发物"同构。
  # 链接只要 libctru，零新增依赖（CIA 打包用 RA 仓库自带的
  # pkg/ctr/tools/makerom-linux/bannertool-linux）。RetroArch 默认 pin
  # tip 快照 d7cc9bc（tool69 实测组合），原因见 workflow_dispatch 输入说明。
  ra-ctr:
    name: RetroArch 3DS full (3dsx/cia)
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 core 静态库
        run: |
          set -u
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          log=/tmp/ctr-core.log
          if ! make -C core platform=ctr -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::core 构建失败"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find' "$log" \
              | head -15 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          ls -l core/makecode_arcade_libretro_ctr.a

      - name: 拉 RetroArch（pin ${{ github.event.inputs.retroarch_ref || 'd7cc9bc' }}）
        env:
          REF: ${{ github.event.inputs.retroarch_ref || 'd7cc9bc' }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -u
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          # REF 可为 tag 或 commit SHA。GitHub 不支持按 SHA fetch（
          # couldn't find remote ref，实测），走 codeload tarball：tag/SHA
          # 通吃、不需要子模块（ctr/vita 构建的依赖都在树内）。
          # 默认 d7cc9bc = tool69 实测通过组合：Vita 走 vitaGL（依赖链由
          # tools/setup_vita_gl_stack.sh 装）、3DS 有 prebuilt shader fallback。
          rm -rf /tmp/ra && mkdir -p /tmp/ra
          curl -fsSL "https://github.com/libretro/RetroArch/archive/${REF}.tar.gz" \
            | tar xz --strip-components=1 -C /tmp/ra
          head -3 /tmp/ra/Makefile.ctr /tmp/ra/Makefile.vita >/dev/null
          echo "RetroArch 树就绪"

      - name: 链 RA 3DS 完整前端（.3dsx + .cia）
        run: |
          set -u
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          # Makefile.ctr 除了 DEVKITPRO 还要求 DEVKITARM（缺了报
          # "recipe commences before first target" 的迷惑错误，tool69 实测）
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          # CIA 打包用 RA 仓库自带的 pkg/ctr/tools/makerom-linux/bannertool-linux
          cp core/makecode_arcade_libretro_ctr.a /tmp/ra/libretro_ctr.a
          log=/tmp/ra-ctr.log
          if ! make -f /tmp/ra/Makefile.ctr -C /tmp/ra -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::RA 3DS 链接失败"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          # 全量 make 若没带出 cia（部分版本 cia 是独立目标），补一刀
          make -f /tmp/ra/Makefile.ctr -C /tmp/ra retroarch_3ds.cia >> "$log" 2>&1 || true
          ls -l /tmp/ra/retroarch_3ds.3dsx /tmp/ra/retroarch_3ds.cia

      - name: 核心 CIA（官方"每核心一个 CIA"同构，定制身份）
        run: |
          set -u
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          cd /tmp/ra
          # RA 模板（pkg/ctr/tools/template.rsf）全参数化：APP_TITLE/
          # PRODUCT_CODE/UNIQUE_ID/ICON/BANNER 都是 make 变量。
          # 先删按 RA 默认值生成的 .bnr/.icn/.smdh/.cia——make 按 mtime
          # 跳过，不删则身份改动不生效（同 build_target.sh 的 mtime 坑）。
          # UniqueId 0xF1CA1 / CTR-P-MCA2：与极简前端 CIA（0xF1CA0 /
          # CTR-P-MCA1）可共存安装，互不覆盖。
          rm -f retroarch_3ds.bnr retroarch_3ds.icn retroarch_3ds.smdh retroarch_3ds.cia
          make -f Makefile.ctr retroarch_3ds.cia \
            APP_TITLE="MakeCode Arcade" \
            APP_DESCRIPTION="MakeCode Arcade (RetroArch core)" \
            APP_AUTHOR="MCA (unofficial)" \
            APP_PRODUCT_CODE="CTR-P-MCA2" \
            APP_UNIQUE_ID=0xF1CA1 \
            APP_ICON="$GITHUB_WORKSPACE/frontends/ctr/icon48.png" \
            APP_BANNER="$GITHUB_WORKSPACE/frontends/ctr/banner256.png" \
            APP_AUDIO="$GITHUB_WORKSPACE/frontends/ctr/banner.wav" \
            >> /tmp/ra-ctr.log 2>&1 || {
              echo "::error::核心 CIA 打包失败"
              tail -15 /tmp/ra-ctr.log | cut -c1-300 | sed 's/^/::error::  /'
              exit 1
            }
          cp retroarch_3ds.cia mca_libretro.cia
          ls -l mca_libretro.cia

      - name: 校验 core 真链进 ELF
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
            export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
            cd /tmp/ra || exit 1
            fail() { echo "FAIL: $*"; exit 1; }
            n=$(arm-none-eabi-nm retroarch_3ds.elf 2>/dev/null | grep -cE ' T retro_')
            echo "retro_* T 符号: $n 个"
            [ "$n" -ge 100 ] || fail "retro_* 符号过少（$n）"
            for s in retro_load_game mcaCtrInitGcHeap; do
              arm-none-eabi-nm retroarch_3ds.elf | grep -qE " T $s\$" || fail "缺 $s"
            done
            echo "core 符号校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -20 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -5 "$out"

      - name: 上传 RA 3DS 包（3dsx + cia + 核心 cia）
        uses: actions/upload-artifact@v4
        with:
          name: ctr-ra-pack
          path: |
            /tmp/ra/retroarch_3ds.3dsx
            /tmp/ra/retroarch_3ds.cia
            /tmp/ra/mca_libretro.cia
          if-no-files-found: error

  # ============================================================ RA 完整前端（Vita）
  # 第二级构建 + 核心包：Makefile.vita 默认走 vitaGL 路径，需要 5 个
  # 额外依赖库（taiHEN -> SceShaccCgExt -> vitashark -> math-neon ->
  # vitaGL），由 tools/setup_vita_gl_stack.sh 固化（tool69 同配方）。
  # 产物：官方 core-vpk 分发同构的 mca_libretro.vpk + 裸 mca_libretro.self
  #（可并入用户已装的 RetroArch）+ mca_libretro.info。
  ra-vita:
    name: RetroArch Vita full + core pack (vpk/self)
    runs-on: ubuntu-24.04
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 vitaGL 依赖链（tools/setup_vita_gl_stack.sh）
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          arm-vita-eabi-gcc --version | head -1
          command -v cmake >/dev/null || { apt-get update -qq && apt-get install -y -qq cmake; }
          command -v git   >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          sh tools/setup_vita_gl_stack.sh

      - name: 编译 core 静态库
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          log=/tmp/vita-core.log
          if ! make -C core platform=vita -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::core 构建失败"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find' "$log" \
              | head -15 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          ls -l core/makecode_arcade_libretro_vita.a

      - name: 拉 RetroArch（pin ${{ github.event.inputs.retroarch_ref || 'd7cc9bc' }}）
        env:
          REF: ${{ github.event.inputs.retroarch_ref || 'd7cc9bc' }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -u
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          # REF 可为 tag 或 commit SHA；GitHub 不支持按 SHA fetch（实测），
          # 走 codeload tarball（依赖都在树内，不需要子模块）
          rm -rf /tmp/ra && mkdir -p /tmp/ra
          curl -fsSL "https://github.com/libretro/RetroArch/archive/${REF}.tar.gz" \
            | tar xz --strip-components=1 -C /tmp/ra
          head -3 /tmp/ra/Makefile.ctr /tmp/ra/Makefile.vita >/dev/null
          echo "RetroArch 树就绪"

      - name: 链 RA Vita 完整前端（.self）
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          cp core/makecode_arcade_libretro_vita.a /tmp/ra/libretro_vita.a
          log=/tmp/ra-vita.log
          if ! make -f /tmp/ra/Makefile.vita -C /tmp/ra retroarch_vita.self -j"$(nproc)" > "$log" 2>&1; then
            echo "::error::RA Vita 链接失败"
            grep -nE 'error:|Error [0-9]|undefined reference|cannot find|No rule' "$log" \
              | head -20 | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          ls -l /tmp/ra/retroarch_vita.self

      - name: 打核心包（mca_libretro.vpk + self + info）
        run: |
          set -u
          export VITASDK="${VITASDK:-/opt/vitasdk}"
          export PATH="$VITASDK/bin:$PATH"
          cd /tmp/ra || exit 1
          # TITLE_ID 与已装官方 RetroArch（RETROVITA）独立，并存不冲突
          vita-mksfoex -s TITLE_ID=MCAC00001 "MakeCode Arcade" -d ATTRIBUTE2=12 param_mca.sfo
          # vita-pack-vpk 的 -a 是 --add src=dst（不是图标参数，tool69 实测）
          vita-pack-vpk -s param_mca.sfo -b retroarch_vita.self \
            -a "$GITHUB_WORKSPACE/frontends/vita/icon0.png=sce_sys/icon0.png" \
            mca_libretro.vpk
          cp retroarch_vita.self mca_libretro.self
          cp "$GITHUB_WORKSPACE/frontends/vita/mca_libretro.info" mca_libretro.info
          ls -l mca_libretro.vpk mca_libretro.self mca_libretro.info

      - name: 校验核心包
        run: |
          set +e
          out=$(mktemp)
          (
            set -u
            export VITASDK="${VITASDK:-/opt/vitasdk}"
            export PATH="$VITASDK/bin:$PATH"
            cd /tmp/ra || exit 1
            fail() { echo "FAIL: $*"; exit 1; }
            # 解 zip 用 unzip（vitasdk 容器不一定带，缺就 apt 装；
            # 不用 python3——vitasdk 容器里未必有）
            command -v unzip >/dev/null || { apt-get update -qq && apt-get install -y -qq unzip; }
            unzip -l mca_libretro.vpk
            unzip -l mca_libretro.vpk | grep -q 'sce_sys/param.sfo' || fail "vpk 缺 param.sfo"
            unzip -l mca_libretro.vpk | grep -q 'sce_sys/icon0.png'  || fail "vpk 缺 icon0"
            # eboot 必须是 fSELF（SCE\x00 头，官方分发形态；vita-pack-vpk
            # 从 .self 直收，这一步断言防的是误把裸 velf 打进包）
            unzip -p mca_libretro.vpk eboot.bin > /tmp/eboot.bin
            # 只比前 4 字节（cmp 全文必然 EOF 不等，第二轮实测）；
            # \000 用八进制（dash 的 printf 不认 \xHH）
            head -c 4 /tmp/eboot.bin > /tmp/eboot-head
            printf 'SCE\000' > /tmp/sce-magic
            cmp -s /tmp/sce-magic /tmp/eboot-head \
              || { od -An -tx1 -N8 /tmp/eboot.bin; fail "eboot.bin 头不是 SCE 自识别 fSELF"; }
            echo "eboot.bin: $(stat -c %s /tmp/eboot.bin) B, fSELF 头正确"
            unzip -p mca_libretro.vpk sce_sys/param.sfo | grep -aq MCAC00001 \
              || fail "param.sfo 缺 TITLE_ID=MCAC00001"
            unzip -p mca_libretro.vpk sce_sys/param.sfo | grep -aq 'MakeCode Arcade' \
              || fail "param.sfo 缺标题"
            echo "param.sfo 校验通过"
            n=$(arm-vita-eabi-nm retroarch_vita.elf.unstripped.elf 2>/dev/null | grep -cE ' T retro_')
            echo "retro_* T 符号: $n 个"
            [ "$n" -ge 100 ] || fail "retro_* 符号过少（$n）"
            for s in retro_load_game mcaVitaInitGcHeap; do
              arm-vita-eabi-nm retroarch_vita.elf.unstripped.elf | grep -qE " T $s\$" || fail "缺 $s"
            done
            echo "核心包校验通过"
          ) > "$out" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::校验失败（rc=$rc）"
            tail -25 "$out" | cut -c1-300 | sed 's/^/::error::  /'
            exit 1
          fi
          tail -6 "$out"

      - name: 上传 RA Vita 核心包（vpk + self + info）
        uses: actions/upload-artifact@v4
        with:
          name: vita-ra-pack
          path: |
            /tmp/ra/mca_libretro.vpk
            /tmp/ra/mca_libretro.self
            /tmp/ra/mca_libretro.info
          if-no-files-found: error

  # ============================================================ 发版上传
  # 推 core-v* tag（或 dispatch 带 upload_tag 输入）时：把 3DS/Vita 前端
  # 整包追加到核心发版的同一个 Release。build.yml 的 release job 负责
  # 建 Release（10 个核心 zip）；两条流水线并行，Release 建好的时间不定，
  # 所以这里轮询等待（最长 60 分钟），出现后 --clobber 上传（重跑幂等）。
  # 每个文件是什么、给谁用的，见 .github/release-notes/PLAYER-GUIDE-FOOTER.md
  # 的资产分组表（发版正文尾部自动带）。
  frontend-release:
    name: upload 3DS/Vita packages to core release
    needs: [core-ctr, core-vita, ra-ctr, ra-vita]
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/core-v') ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: 归集资产
        run: |
          set -euo pipefail
          mkdir -p pkg
          # 3DS：极简（3dsx + cia）+ 核心 CIA。RA 3DS 完整前端本体
          #（retroarch_3ds.3dsx/.cia）不进 Release——想用完整 RA 的玩家装
          # 核心 CIA 即可（其内含 RA 前端本体）。
          cp art/ctr-testpack/mca_ctr.3dsx art/ctr-testpack/mca_ctr.cia pkg/
          cp art/ctr-ra-pack/mca_libretro.cia pkg/
          # Vita：极简 vpk + 核心 vpk / 裸 self / info
          cp art/vita-testpack/mca_vita.vpk pkg/
          cp art/vita-ra-pack/mca_libretro.vpk art/vita-ra-pack/mca_libretro.self pkg/
          cp art/vita-ra-pack/mca_libretro.info pkg/
          ls -l pkg/

      - name: 轮询等待 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.upload_tag }}" ]; then
            tag="${{ inputs.upload_tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "目标 Release: $tag"
          # 轮询：build.yml 的 release job 要等 zig/android/lakka 全编完才建
          # Release，慢时几十分钟。60 分钟内出现即可；超时则红——确认主
          # 流水线没挂后重跑本 job 即可，上传幂等（--clobber）。
          for i in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release 已存在（第 $i 次检查）"
              break
            fi
            echo "等待 Release 建立… ($i/60)"
            sleep 60
          done
          gh release view "$tag" >/dev/null 2>&1 || {
            echo "::error::60 分钟内 Release $tag 未建立（build.yml 的 release job 可能失败了），确认后重跑本 job"
            exit 1
          }
          gh release upload "$tag" pkg/* --clobber
          echo "== Release 资产 =="
          gh release view "$tag" --json assets --jq '.assets[] | "  " + .name + "  " + (.size|tostring) + " B"'
