# NX 诊断产物（只在排查"一启动就崩"时用，不参与发版）
#
# 产出四个 NRO，用来把故障范围切开：
#   probe.nro       纯 libnx 控制台程序（固件 / applet 模式 / 内存）
#   ra_plain.nro    RetroArch 本体，不带核心（HAVE_STATIC_DUMMY=1）
#   ra_stubcore.nro RetroArch + 空核心（只为验证静态核心这条机制）
#   mca_boot.nro    RetroArch + 我们的核心，带开机 trace 到 sdmc:/switch/mca_boot.log
#
# 触发：手动 workflow_dispatch，或 push 改了 tools/nx-probe/**、核心源码与本文件。
name: NX diag (probe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/nx-probe/**"
      - ".github/workflows/nx-diag.yml"
      - "core/src/**"
      - "core/Makefile"
      - "runtime/**"

concurrency:
  group: nx-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: probe NROs
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具与 portlibs
        run: |
          set -u
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          dkp-pacman -S --noconfirm --needed \
            switch-ffmpeg switch-libvpx switch-opus switch-libpng \
            switch-zlib switch-bzip2 switch-liblzma switch-libexpat \
            switch-mesa switch-libdrm_nouveau 2>&1 | tail -3

      - name: 构建诊断 NRO
        # 这一步挂了不要让后面的对比构建也跟着跳过 —— 对比构建（空核心 vs
        # 我们的核心）才是判"机制问题还是代码问题"的关键证据。诊断 workflow
        # 的原则是"能产出多少算多少"，所以这里只告警不阻断。
        continue-on-error: true
        run: |
          set +e
          out=$(mktemp)
          bash tools/nx-probe/build-diag.sh out/nx-diag > "$out" 2>&1
          rc=$?
          cat "$out"
          if [ "$rc" -ne 0 ]; then
            # 注解有 10 条上限，逐行发会被截断到只剩开头。这里把整段尾部
            # 压成一条多行注解（%0A 会被 GitHub 还原成换行）。
            msg=$(tail -40 "$out" | cut -c1-400 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::诊断构建失败（rc=$rc）%0A$msg"
            exit 1
          fi

      # 对照组：ra_stubcore（空核心）与 mca_boot（我们的核心 + 开机 trace）。
      # 这一步要编我们的静态库 + 再克隆一份 RetroArch，耗时较长，但它是
      # "机制问题还是我们的代码问题"的唯一干净判据。
      - name: 构建对比 NRO（空核心 / 我们的核心）
        run: |
          set +e
          out=$(mktemp)
          bash tools/nx-probe/build-bisect.sh out/nx-diag > "$out" 2>&1
          rc=$?
          cat "$out"
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -40 "$out" | cut -c1-400 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::对比构建失败（rc=$rc）%0A$msg"
            exit 1
          fi

      # 即使某个对照构建失败也把已产出的东西传上去：排查现场拿到一半对照
      # 也远好过什么都拿不到（之前一次失败把 4 个产物全丢在容器里）。
      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx-diag
          path: out/nx-diag
          if-no-files-found: warn

  # workflow artifact 要登录才能下载，而排查现场往往只有一只手机/一台 PC。
  # 这里把产物挂到一个固定的预发布 Release（tag 固定 nx-diag），
  # 谁都能直接点链接下载。不是发版，不进 core-v*/nx-v* 体系。
  publish:
    name: publish nx-diag release
    needs: diag
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nx-diag
          path: pkg

      - name: 挂到固定 tag nx-diag
        # 发布失败不该让整条诊断链变红：文件还在 run 的 artifact 里，
        # 顶多是"要登录才能下"。所以这里只 warning 不 error，并且把
        # pkg 里的真实内容全打出来，便于下次一眼看出为什么没发出去。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "=== pkg 内容 ==="
          find pkg -type f -printf '%s\t%p\n' 2>/dev/null | sort -k2 || ls -la pkg

          TAG=nx-diag
          TITLE="nx-diag - 排查用探针（不是发版）"
          NOTES=tools/nx-probe/diag-notes.md
          if [ ! -f "$NOTES" ]; then echo "::warning::缺少 $NOTES"; exit 0; fi

          # 不假设 download-artifact 的落地层级：递归找 .nro，有几个发几个。
          mapfile -t NROS < <(find pkg -type f -name '*.nro')
          if [ "${#NROS[@]}" -eq 0 ]; then
            echo "::warning::pkg 里没有任何 .nro，跳过发布（artifact 仍在本次 run 上）"
            exit 0
          fi
          echo "将发布 ${#NROS[@]} 个 NRO"
          printf '  %s\n' "${NROS[@]}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES" --prerelease \
              || { echo "::warning::创建 release 失败"; exit 0; }
          fi

          rc=0
          for f in "${NROS[@]}"; do
            if gh release upload "$TAG" "$f" --clobber; then
              echo "  上传 OK: $(basename "$f")"
            else
              echo "::warning::上传失败: $f"
              rc=1
            fi
          done
          gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" || true
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "  " + .name + "  " + (.size|tostring) + " B"' || true
          exit $rc
