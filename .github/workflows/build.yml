# GitHub Actions：编译回归 + 可下载产物
#
# 分工（两个 CI 文件互不替代）：
#   .github/workflows/build.yml —— 本仓库自己的编译回归，每次 push / PR 跑，
#                                  产物是 workflow artifact（保留 30 天）
#   .gitlab-ci.yml             —— 给 libretro 官方 buildbot 收录用的 GitLab CI，
#                                  不在这里跑，官方镜像仓库时才会生效
#
# 工具链说明（重要）：两套 job 各管一半——
#   * 发行版工具链 job（gcc / mingw-w64 / Android NDK）：证明"源码在官方
#     buildbot 的构型下编得过"。**不要换成 zig**：工具链差异本身就是回归
#     价值（zig 的 mingw 头默认 _WIN32_WINNT=0x0a00，会藏住 GetTickCount64
#     这类问题，正是发行版 gcc 在 CI 上第一次抓出来的）。
#   * zig job：与本地发版矩阵（tools/build_matrix.sh）同一工具链、同一
#     版本、同一份 build_target.sh，验证发版构型在 CI 上可复现。发行版
#     工具链覆盖不了的两项也在这里补上：windows-arm64、glibc 2.17 基线断言。
#     Android 本地就是 NDK clang 编，由上面 android job 覆盖，无需 zig。
# 两边都绿 = 发版产物（本地 zig）与收录产物（发行版 gcc）都有回归兜底。
#
# 矩阵只列验证过能编过的平台：
#   linux-x64 / linux-arm64 / linux-armhf（.so）
#   windows-x64（mingw-w64，.dll）
#   android arm64-v8a / armeabi-v7a（ndk-build，见 core/jni/）
#   macOS 单独一个实验 job（continue-on-error，不阻塞）
#   zig：x64/arm64 Windows + Linux x64/arm64/armhf（基线 2.17）
#   behavior-*：真 ARM 硬件 runner（ubuntu-24.04-arm / windows-11-arm，
#     公开仓库免费）上跑 S1–S10 快照回归 —— 行为层验证，见该 job 注释

name: build

on:
  push:
    branches: [main]
    tags: ['core-v*']
  pull_request:
  workflow_dispatch:

# 默认只读：回归 job 不改仓库内容。只有 release job（推 core-v* tag 时）
# 在 job 级申请 contents: write，用来建 Release 和上传附件。
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORENAME: makecode_arcade

jobs:
  # ------------------------------------------------------------------ Linux
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triple: x86_64-linux-gnu
            platform: unix
            cc: gcc
            cxx: g++
            apt: ''
          - arch: arm64
            triple: aarch64-linux-gnu
            platform: unix-aarch64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            apt: g++-aarch64-linux-gnu
          - arch: armhf
            triple: arm-linux-gnueabihf
            platform: unix-armv7-hardfloat-neon
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            apt: g++-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉工具链
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ${{ matrix.apt }}

      # CC/CXX 一律走环境变量：make 的命令行赋值会覆盖 Makefile 里的
      # `LDFLAGS += -shared`，导致 -shared 丢失（在 Windows 上表现为
      # lld-link: undefined symbol: WinMain）。环境变量是在 Makefile 的追加
      # 赋值之前生效，两者叠加。
      #
      # 链接参数刻意保持 gcc 默认：官方 buildbot 就是这么编的，加
      # -static-libstdc++ 反而可能在 x86_64 上撞 libstdc++.a 的
      # "relocation ... can not be used when making a shared object"。
      # 依赖 libstdc++.so.6 是 Linux core 的常态（RetroArch 自己也链它）。
      - name: 编译
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -f core/Makefile platform=${{ matrix.platform }} -j"$(nproc)"

      - name: 检查动态依赖
        run: |
          so=core/makecode_arcade_libretro.so
          file "$so"
          echo "== NEEDED =="
          readelf -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/  \1/p'
          echo "== GLIBC 符号版本（信息性） =="
          readelf -V "$so" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tr '\n' ' ' || true
          echo
          # 只允许常见系统库（libatomic 是 armhf 上 64 位原子操作可能带出来的，
          # ld-linux 是 zig 链接器的习惯，一并放行）：出现别的（静态链进来的
          # libc、libandroid 之类）说明链接方式跑偏，玩家机器上加载会失败
          bad=0
          for lib in $(readelf -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$lib" in
              libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*| \
              libstdc++.so.*|libgcc_s.so.*|libatomic.so.*|ld-linux*.so.*) ;;
              *) echo "::error file=core/Makefile::意外的动态依赖 $lib"; bad=1 ;;
            esac
          done
          [ "$bad" = 0 ] || exit 1

      - name: 归档
        run: |
          mkdir -p "core/dist/${{ matrix.triple }}"
          cp core/makecode_arcade_libretro.so "core/dist/${{ matrix.triple }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: core/dist/${{ matrix.triple }}/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Windows
  windows:
    name: windows-x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # pxt VM 用 pthread，必须 posix 线程模型（win32 变体没有 pthread.h）。
      # Ubuntu 的做法是 update-alternatives 在两个变体间切换，切完用不带
      # 后缀的名字即可（比直接写 -posix 后缀可靠：后缀名字随包版本变过）。
      #
      # 失败时把输出转成 ::error:: 注解：job 日志要鉴权才能下，注解在
      # 公开仓库上是可匿名读的，排查只靠它。
      - name: 安装 mingw-w64（posix 线程模型）
        run: |
          set -u
          out=$( (
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64-posix
            sudo update-alternatives --set x86_64-w64-mingw32-gcc \
                 /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ \
                 /usr/bin/x86_64-w64-mingw32-g++-posix
            x86_64-w64-mingw32-gcc --version | head -1
            x86_64-w64-mingw32-g++ --version | head -1
            ls -l /usr/x86_64-w64-mingw32/lib/libpthread* || true
          ) 2>&1 ) || {
            printf '%s\n' "$out" | tail -40
            printf '%s\n' "$out" | tail -40 | sed 's/^/::error::mingw /'
            exit 1
          }
          printf '%s\n' "$out" | tail -12

      - name: 编译
        env:
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          # 三个运行库全部静态链：分发出去的 DLL 不能依赖
          # libstdc++-6.dll / libgcc_s_seh-1.dll / libwinpthread-1.dll
          LDFLAGS: -static-libgcc -static-libstdc++
          # -Wl,-Bstatic 只作用于紧跟的 -lpthread（放行尾，符号已在前面的
          # 目标文件里出现，静态库才能被正确抽取）
          LDLIBS: -Wl,-Bstatic -lpthread -Wl,-Bdynamic
        run: |
          set -u
          log=out/ci-win64.log
          mkdir -p out
          # 输出重定向到文件而不是 $(...) 捕获：make 的命令回显走 stdout（管道
          # 下是块缓冲），编译错误走 stderr（无缓冲），捕获方式会把所有回显
          # 堆积到末尾，真正的错误行反而看不到
          if ! make -f core/Makefile platform=win64 -j"$(nproc)" > "$log" 2>&1; then
            first=$(grep -n -m1 'error:' "$log" | cut -d: -f1 || true)
            if [ -n "${first:-}" ]; then
              sed -n "$((first > 8 ? first - 8 : 1)),$((first + 4))p" "$log" \
                | sed 's/^/::error::win64 /'
            fi
            grep -E 'error:|undefined reference|cannot find|Error [0-9]' "$log" | head -20
            exit 1
          fi
          tail -5 "$log"

      - name: 检查导入表与导出符号
        run: |
          dll=core/makecode_arcade_libretro.dll
          echo "== 导入的 DLL =="
          x86_64-w64-mingw32-objdump -p "$dll" | grep -i 'DLL Name' | sort -u
          for bad in libstdc++-6.dll libgcc_s_seh-1.dll libgcc_s_dw2-1.dll libwinpthread-1.dll; do
            if x86_64-w64-mingw32-objdump -p "$dll" | grep -q "$bad"; then
              echo "::error file=core/Makefile::DLL 依赖 $bad，玩家机器上会加载失败"
              exit 1
            fi
          done
          # 导出符号是 libretro 的硬要求（--export-all-symbols 生效检查）
          for sym in retro_init retro_run retro_get_system_info retro_load_game; do
            x86_64-w64-mingw32-objdump -p "$dll" | grep -qw "$sym" \
              || { echo "::error::缺少导出符号 $sym"; exit 1; }
          done

      - name: 归档
        run: |
          mkdir -p core/dist/x86_64-windows-gnu
          cp core/makecode_arcade_libretro.dll core/dist/x86_64-windows-gnu/

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-windows-gnu
          path: core/dist/x86_64-windows-gnu/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Android
  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android21
          - abi: armeabi-v7a
            triple: armv7a-linux-androideabi21
    steps:
      - uses: actions/checkout@v4

      - name: 定位 NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ ! -x "$NDK/ndk-build" ]; then
            echo "::error::找不到 ndk-build（\$ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME）"
            exit 1
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          sed -n 's/^Pkg.Revision *= *//p' "$NDK/source.properties" | head -1 | sed 's/^/NDK 版本: /'

      # 与官方 android-jni 模板同一套参数：APP_BUILD_SCRIPT / NDK_APPLICATION_MK
      # 明指 core/jni/，ABI 逐个覆盖；产物落 out/ 不污染源码树
      - name: 编译
        run: |
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=core/jni/Android.mk \
            NDK_APPLICATION_MK=core/jni/Application.mk \
            APP_ABI=${{ matrix.abi }} \
            NDK_OUT=out/ndk/obj NDK_LIBS_OUT=out/ndk/libs \
            -j"$(nproc)"

      - name: 检查 .so（16KB 页对齐 + 无 libc++_shared 依赖）
        run: |
          so="out/ndk/libs/${{ matrix.abi }}/libmakecode_arcade_libretro.so"
          ls -l "$so"
          echo "== NEEDED =="
          readelf -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/  \1/p'
          if readelf -d "$so" | grep -q 'libc++_shared'; then
            echo "::error file=core/jni/Application.mk::依赖 libc++_shared.so，APP_STL 应为 c++_static"
            exit 1
          fi
          # Android 15 起有 16KB 页设备，LOAD 段必须 0x4000 对齐
          echo "== LOAD 对齐 =="
          readelf -lW "$so" | awk '$1 == "LOAD" { print "  " $NF }' | sort -u
          if readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | grep -qv '^0x4000$'; then
            echo "::error file=core/jni/Android.mk::LOAD 段不是 16KB 对齐，16KB 页设备无法 dlopen"
            exit 1
          fi

      # 发行包里的 Android 产物叫 makecode_arcade_libretro.so（无 lib 前缀），
      # 与 package_release.sh 的 glob 对齐
      - name: 归档
        run: |
          mkdir -p "core/dist/${{ matrix.triple }}"
          cp "out/ndk/libs/${{ matrix.abi }}/libmakecode_arcade_libretro.so" \
             "core/dist/${{ matrix.triple }}/makecode_arcade_libretro.so"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: core/dist/${{ matrix.triple }}/*
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ zig
  # 与本地发版矩阵同工具链的一致性验证（分工见文件头注释）。
  # 版本号必须与本地保持同步：zig 升级可能改变 libc 基线与代码生成。
  zig:
    name: zig-${{ matrix.triple }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-windows-gnu
            ext: dll
            apt: ''
          - triple: aarch64-windows-gnu
            ext: dll
            apt: ''
          - triple: x86_64-linux-gnu.2.17
            ext: so
            apt: ''
          - triple: aarch64-linux-gnu.2.17
            ext: so
            apt: ''
          - triple: arm-linux-gnueabihf.2.17
            ext: so
            apt: ''
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig 0.17.0（与本地发版矩阵同版本）
        run: |
          set -euo pipefail
          # set -e 的静默死法排查过两轮，加 ERR trap 兜底：任何未守护的失败
          # 都会带行号转成注解（job 日志要鉴权，注解可匿名读）
          trap 'echo "::error::zig 安装失败于第 $LINENO 行（exit=$?）"' ERR
          # mlugg/setup-zig 的版本索引对 0.17.0 返回 404，直接下载。
          # 0.14.1 起 tarball 命名是 arch 在前（zig-x86_64-linux-…）
          # 主源 ziglang.org（Cloudflare），回退 machengine 包镜像
          cd "$RUNNER_TEMP"
          ok=0
          for base in "https://ziglang.org/download/0.17.0" \
                      "https://pkg.machengine.org/zig"; do
            if curl -fsSLo zig.tar.xz "$base/zig-x86_64-linux-0.17.0.tar.xz" 2>curl.err; then
              if tar -tf zig.tar.xz >/dev/null 2>tar.err; then ok=1; break; fi
              # 拿到的不是 tar.xz（多半是拦截页），把内容特征转成注解排查
              echo "::error::$base 返回的不是合法 tar.xz：$(file -b zig.tar.xz | cut -c1-80)"
              head -c 120 zig.tar.xz | tr -c '[:print:]\n' '.' | sed 's/^/::error::  /'
            else
              echo "::error::$base 下载失败："
              tail -3 curl.err | sed 's/^/::error::  /'
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::所有源都取不到 zig 0.17.0"; exit 1; }
          # 内层目录名不猜，从 tarball 解析。注意不能写 `tar -tf | head -1`：
          # head 读一行就关管道，tar 写列表时吃 SIGPIPE 以 write error（2）退出，
          # 在 pipefail 下表现为静默 exit 2
          listing="$(tar -tf zig.tar.xz)"
          zigdir="${listing%%/*}"
          tar -xJf zig.tar.xz
          echo "$RUNNER_TEMP/$zigdir" >> "$GITHUB_PATH"
          # 断言拿到的就是发版用的版本，防止 URL 改版后静默装错。
          # 注意 $GITHUB_PATH 只对后续步骤生效，当前步骤要用显式路径
          v="$("$RUNNER_TEMP/$zigdir/zig" version)"
          [ "$v" = "0.17.0" ] || { echo "::error::zig 版本异常：实际 $v"; exit 1; }
          echo "zig $v -> $RUNNER_TEMP/$zigdir"

      - name: 安装 binutils（检查 PE 导入/导出表）
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ${{ matrix.apt }}

      - name: 编译
        run: |
          set -u
          log=out/ci-zig.log
          mkdir -p out
          # 与本地发版同一份脚本、同一组参数；ZIG 覆盖默认的 common tools 路径
          if ! ZIG=zig tools/build_target.sh ${{ matrix.triple }} > "$log" 2>&1; then
            first=$(grep -n -m1 'error:' "$log" | cut -d: -f1 || true)
            if [ -n "${first:-}" ]; then
              sed -n "$((first > 8 ? first - 8 : 1)),$((first + 4))p" "$log" \
                | sed 's/^/::error::zig ${{ matrix.triple }} /'
            fi
            grep -E 'error:|undefined reference|cannot find|Error [0-9]' "$log" | head -20
            exit 1
          fi
          tail -5 "$log"
          ls -l core/dist/${{ matrix.triple }}/

      - name: 检查产物
        run: |
          bin=core/dist/${{ matrix.triple }}/makecode_arcade_libretro.${{ matrix.ext }}
          case ${{ matrix.ext }} in
            so)
              file "$bin"
              echo "== NEEDED =="
              readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/  \1/p'
              # 发版基线钉在 2.17：出现更高版本的符号引用说明 zig 升级或
              # 链接方式变了，老掌机固件会加载失败——发行包的硬断言
              max=$(readelf -V "$bin" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)
              echo "GLIBC 最高符号版本: ${max:-无}"
              if [ -n "$max" ] && \
                 [ "$(printf '%s\n%s\n' "$max" GLIBC_2.17 | sort -V | tail -1)" != "GLIBC_2.17" ]; then
                echo "::error file=tools/build_target.sh::GLIBC 基线超出 2.17（$max），发版包会丢老系统"
                exit 1
              fi
              ;;
            dll)
              # 不能用 x86_64-w64-mingw32-objdump：它解不了 aarch64 PE 的导出表
              # （误报"缺少导出符号"，实际 25 个 retro_* 都在）。pefile 架构无关。
              pip install --quiet pefile
              python3 tools/check_pe.py "$bin"
              ;;
          esac

      # 模块区间是跨会话存档的地基，而 Linux 上它来自 /proc/self/maps 的文本解析
      # （Windows 走 VirtualQuery，桌面回归覆盖不到）。v0.2.14 的真机事故就是这段
      # 解析错了：g_modBase 恒 0 = 跨会话读档全被拒。这里在本机架构上真跑一次自测，
      # 交叉目标跑不了（aarch64/armhf 不能在这个 runner 上执行）。
      - name: 模块区间自测（maps 解析 + 真实区间非零）
        if: matrix.triple == 'x86_64-linux-gnu.2.17'
        run: |
          set -u
          # 失败原因要能匿名读（job 日志要鉴权），所以把尾部转成注解。
          log=out/modrange.log
          mkdir -p out
          echo "python3: $(python3 -V 2>&1) / LANG=${LANG:-unset}"
          if ! python3 tools/test_modrange.py \
                 core/dist/x86_64-linux-gnu.2.17/makecode_arcade_libretro.so \
                 > "$log" 2>&1; then
            tail -30 "$log" | sed 's/^/::error::modrange /'
            echo "::error::模块区间自测失败（见上方 ::error:: 行）"
            exit 1
          fi
          tail -8 "$log"

      - uses: actions/upload-artifact@v4
        with:
          name: zig-${{ matrix.triple }}
          path: core/dist/${{ matrix.triple }}/*
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------- 行为回归（真 ARM runner）
  # GitHub 给公开仓库免费提供真 ARM 硬件 runner（ubuntu-24.04-arm /
  # windows-11-arm，2025-08 GA）。这一层跑的是「行为」而不是「编译」：
  # 用与发版相同的 zig 工具链出 core，再在真实 aarch64 地址空间里跑
  # S1–S10 快照回归。桌面 CI 的 x86_64 job 拿得到的固定地址、glibc 环境
  # 都与发版目标平台不同——只有这一层能替真机拦住「地址不可复现」类
  # bug 的逻辑面（快照逻辑错误在这里被抓，真机只验收平台差异）。
  behavior-arm64:
    name: behavior-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # 与 zig job 同版本同源；区别只是 tarball 取 aarch64-linux 本机版
      # （runner 就是 ARM 硬件，zig 原生跑，无仿真）
      - name: 安装 zig 0.17.0（aarch64-linux 本机版）
        run: |
          set -euo pipefail
          trap 'echo "::error::zig 安装失败于第 $LINENO 行（exit=$?）"' ERR
          cd "$RUNNER_TEMP"
          ok=0
          for base in "https://ziglang.org/download/0.17.0" \
                      "https://pkg.machengine.org/zig"; do
            if curl -fsSLo zig.tar.xz "$base/zig-aarch64-linux-0.17.0.tar.xz" 2>curl.err; then
              if tar -tf zig.tar.xz >/dev/null 2>tar.err; then ok=1; break; fi
              echo "::error::$base 返回的不是合法 tar.xz：$(file -b zig.tar.xz | cut -c1-80)"
            else
              echo "::error::$base 下载失败："
              tail -3 curl.err | sed 's/^/::error::  /'
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::所有源都取不到 zig 0.17.0"; exit 1; }
          listing="$(tar -tf zig.tar.xz)"
          zigdir="${listing%%/*}"
          tar -xJf zig.tar.xz
          echo "$RUNNER_TEMP/$zigdir" >> "$GITHUB_PATH"
          v="$("$RUNNER_TEMP/$zigdir/zig" version)"
          [ "$v" = "0.17.0" ] || { echo "::error::zig 版本异常：实际 $v"; exit 1; }
          echo "zig $v -> $RUNNER_TEMP/$zigdir"

      # 与发版（release job）完全相同的构型：zig 2.17 基线 .so 在真实
      # aarch64 上加载执行，连 glibc 向后兼容这条路也一并验证
      - name: 编译（与发版同构型 aarch64-linux-gnu.2.17）
        run: |
          set -u
          log=out/ci-behavior-arm64.log
          mkdir -p out
          if ! ZIG=zig tools/build_target.sh aarch64-linux-gnu.2.17 > "$log" 2>&1; then
            tail -20 "$log" | sed 's/^/::error::behavior-arm64 /'
            exit 1
          fi
          tail -3 "$log"

      - name: 模块区间自测
        run: |
          set -u
          log=out/modrange-arm64.log
          if ! python3 tools/test_modrange.py \
                 core/dist/aarch64-linux-gnu.2.17/makecode_arcade_libretro.so \
                 > "$log" 2>&1; then
            tail -30 "$log" | sed 's/^/::error::modrange-arm64 /'
            exit 1
          fi
          tail -6 "$log"

      # S1–S10 全套：测试卡带用仓库内置夹具（tools/fixtures/），core 路径
      # 显式指向刚编出的发版构型 .so
      - name: 快照回归 S1–S10
        run: |
          set -u
          log=out/savestate-arm64.log
          if ! python3 tools/test_savestate.py \
                 core/dist/aarch64-linux-gnu.2.17/makecode_arcade_libretro.so \
                 > "$log" 2>&1; then
            tail -40 "$log" | sed 's/^/::error::savestate-arm64 /'
            echo "::error::aarch64 快照回归失败（S1–S10，见上方 ::error:: 行）"
            exit 1
          fi
          tail -12 "$log"

      # 顺带交叉出 windows-arm64 的发版构型 dll，供 windows-11-arm job
      # 在真实 Windows ARM 上实测（zig 是交叉编译器，宿主架构无关）
      - name: 交叉编译 windows-arm64 dll
        run: |
          set -u
          log=out/ci-behavior-winarm64.log
          if ! ZIG=zig tools/build_target.sh aarch64-windows-gnu > "$log" 2>&1; then
            tail -20 "$log" | sed 's/^/::error::behavior-winarm64-build /'
            exit 1
          fi
          tail -3 "$log"
          pip install --quiet pefile
          python3 tools/check_pe.py core/dist/aarch64-windows-gnu/makecode_arcade_libretro.dll

      - uses: actions/upload-artifact@v4
        with:
          name: behavior-aarch64-windows-gnu
          path: core/dist/aarch64-windows-gnu/*
          if-no-files-found: error
          retention-days: 30

  # 实测 windows-arm64 发版构型 dll（上一 job 交叉编出）：真实 Windows on
  # ARM 上加载 + 跑 S1–S10。runner 上的 Python 可用性仍在演进期（
  # setup-python 的 windows-arm64 支持较新），先标实验不阻塞，绿了再转正。
  behavior-win-arm64:
    name: behavior-windows-arm64 (实验)
    runs-on: windows-11-arm
    continue-on-error: true
    needs: [behavior-arm64]
    # PYTHONUTF8：宿主 subprocess（libretro_host.py）的输出解码也统一 UTF-8，
    # 否则 text=True 用 cp1252 解码中文输出会炸在测试脚本的读取侧
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 定位 Python
        shell: bash
        run: |
          for c in python3 python py; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "MCA_PY=$c" >> "$GITHUB_ENV"
              "$c" -V
              exit 0
            fi
          done
          echo "::error::windows-11-arm runner 上找不到 Python（setup-python 支持到位后此 job 转正）"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: behavior-aarch64-windows-gnu
          path: core/dist/aarch64-windows-gnu

      - name: 快照回归 S1–S10
        shell: bash
        run: |
          set -u
          mkdir -p out
          if ! "$MCA_PY" tools/test_savestate.py \
                 core/dist/aarch64-windows-gnu/makecode_arcade_libretro.dll \
                 > out/savestate-winarm64.log 2>&1; then
            tail -40 out/savestate-winarm64.log | sed 's/^/::error::savestate-winarm64 /'
            exit 1
          fi
          tail -12 out/savestate-winarm64.log

  # ------------------------------------------------ 行为回归（32 位分支）
  # armhf 是与 64 位完全不同的堆映射分支（GC_BASE 0x20000000 / TValue 宽度
  # / 快照布局），v0.2.15 的候选基址修复在这一支上从未验证过——这是当前
  # 最大的行为验证空白。GitHub 没有 32 位 ARM runner，所以在 aarch64 真硬件
  # 上用 qemu-user binfmt + armhf rootfs 跑（比 x86 上 qemu 全交叉快得多，
  # 且宿主内核就是 aarch64，与目标掌机同架构族）。
  # 标实验：rootfs 搭建与 qemu 下套件耗时均未在本仓库跑过，绿了再转正。
  behavior-linux-armhf:
    name: behavior-linux-armhf (实验)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig 0.17.0（aarch64-linux 本机版）
        run: |
          set -euo pipefail
          trap 'echo "::error::zig 安装失败于第 $LINENO 行（exit=$?）"' ERR
          cd "$RUNNER_TEMP"
          ok=0
          for base in "https://ziglang.org/download/0.17.0" \
                      "https://pkg.machengine.org/zig"; do
            if curl -fsSLo zig.tar.xz "$base/zig-aarch64-linux-0.17.0.tar.xz" 2>curl.err; then
              if tar -tf zig.tar.xz >/dev/null 2>tar.err; then ok=1; break; fi
              echo "::error::$base 返回的不是合法 tar.xz：$(file -b zig.tar.xz | cut -c1-80)"
            else
              echo "::error::$base 下载失败："
              tail -3 curl.err | sed 's/^/::error::  /'
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::所有源都取不到 zig 0.17.0"; exit 1; }
          listing="$(tar -tf zig.tar.xz)"
          zigdir="${listing%%/*}"
          tar -xJf zig.tar.xz
          echo "$RUNNER_TEMP/$zigdir" >> "$GITHUB_PATH"

      - name: 编译 armhf（与发版同构型 arm-linux-gnueabihf.2.17）
        run: |
          set -u
          log=out/ci-behavior-armhf.log
          mkdir -p out
          if ! ZIG=zig tools/build_target.sh arm-linux-gnueabihf.2.17 > "$log" 2>&1; then
            tail -20 "$log" | sed 's/^/::error::behavior-armhf-build /'
            exit 1
          fi
          tail -3 "$log"
          file core/dist/arm-linux-gnueabihf.2.17/makecode_arcade_libretro.so

      # 用 armhf rootfs 而不是宿主 multiarch：python3 的 /usr/bin 解释器路径
      # 两架构互斥，multiarch 共装会撞文件；独立 rootfs 无此问题
      - name: 搭建 armhf rootfs（qemu-user binfmt + debootstrap）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debootstrap qemu-user-static
          sudo debootstrap --arch=armhf --variant=minbase \
            --include=python3 noble /opt/armhf-root \
            http://ports.ubuntu.com/ubuntu-ports
          sudo mount -t proc proc /opt/armhf-root/proc
          echo "== rootfs 内 python =="
          sudo chroot /opt/armhf-root python3 -V

      - name: 快照回归 S1–S10（32 位 .so 在 armhf 用户态）
        run: |
          set -u
          R=/opt/armhf-root/repo
          sudo mkdir -p "$R"
          sudo cp -r core/dist tools "$R/"
          set +e
          # 注意 chroot 内路径是 /repo（宿主的 /opt/armhf-root/repo），别传宿主路径
          sudo chroot /opt/armhf-root env PYTHONUTF8=1 \
            python3 /repo/tools/test_savestate.py \
            /repo/core/dist/arm-linux-gnueabihf.2.17/makecode_arcade_libretro.so \
            > armhf-suite.log 2>&1
          rc=$?
          set -e
          # 失败日志转注解（job 日志要鉴权，注解可匿名读）
          tail -40 armhf-suite.log | sed 's/^/::error::armhf /'
          exit $rc

  # ------------------------------------------- 独立前端交叉验证（miniretro）
  # miniretro（davidgfnet/miniretro）是第三方极简 CLI libretro 前端，专为
  # 自动化测试 core 设计。价值：自研 libretro_host.py 对 libretro API 的
  # 实现方式单一，偶然容忍的 core 端 API 误用（回调时序/像素格式假设等）
  # 换一个独立前端实现就可能暴露——相当于给 core 做第二次「前端方言」体检。
  # 标实验：miniretro 的 CLI 细节与卡带加载路径未验证过，绿了再固化用例。
  behavior-miniretro:
    name: behavior-miniretro (实验)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig 0.17.0（aarch64-linux 本机版）
        run: |
          set -euo pipefail
          trap 'echo "::error::zig 安装失败于第 $LINENO 行（exit=$?）"' ERR
          cd "$RUNNER_TEMP"
          ok=0
          for base in "https://ziglang.org/download/0.17.0" \
                      "https://pkg.machengine.org/zig"; do
            if curl -fsSLo zig.tar.xz "$base/zig-aarch64-linux-0.17.0.tar.xz" 2>curl.err; then
              if tar -tf zig.tar.xz >/dev/null 2>tar.err; then ok=1; break; fi
              echo "::error::$base 返回的不是合法 tar.xz：$(file -b zig.tar.xz | cut -c1-80)"
            else
              echo "::error::$base 下载失败："
              tail -3 curl.err | sed 's/^/::error::  /'
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::所有源都取不到 zig 0.17.0"; exit 1; }
          listing="$(tar -tf zig.tar.xz)"
          zigdir="${listing%%/*}"
          tar -xJf zig.tar.xz
          echo "$RUNNER_TEMP/$zigdir" >> "$GITHUB_PATH"

      - name: 编译（与发版同构型）
        run: ZIG=zig tools/build_target.sh aarch64-linux-gnu.2.17

      - name: 编译 miniretro
        run: |
          git clone --depth 1 https://github.com/davidgfnet/miniretro
          make -C miniretro -j"$(nproc)"
          ./miniretro/miniretro --help 2>&1 | head -20 || true

      # 跑 900 帧（15 秒游戏时长），每 300 帧落一帧画面；core 不崩、
      # 有画面产出即算通过。作为独立前端，只做冒烟，不做逐帧比对
      # （像素格式/时序处理与自研宿主不同，哈希不可直接比）。
      # dump 输出目录 README 未定死，按"运行后新出现的 PNG"断言，不猜路径。
      - name: miniretro 加载 core 跑 900 帧
        run: |
          mkdir -p out/mr out/mr-system
          set +e
          # 必需参数：--core --rom --output（帧转储前缀）--system（system 目录）
          ./miniretro/miniretro \
            --core core/dist/aarch64-linux-gnu.2.17/makecode_arcade_libretro.so \
            --rom tools/fixtures/ping.pxt64 \
            --output out/mr/ping \
            --system out/mr-system \
            --frames 900 --dump-frames-every 300 --dump-frames 300 600 900 \
            > miniretro.log 2>&1
          rc=$?
          set -e
          n=$(find out/mr -name '*.png' | wc -l)
          last=$(tail -3 miniretro.log | tr '\n' '|' | cut -c1-220)
          echo "::error::miniretro rc=$rc pngs=$n last3: $last"
          [ "$rc" -eq 0 ] || exit 1
          [ "$n" -ge 2 ] || { echo "::error::900 帧只产出 $n 帧画面"; exit 1; }

  # ------------------------------------------------------------------ macOS
  # 实验：Makefile 支持 osx，但本机没有 macOS 工具链，作者未在真机验证过
  # 加载/音频；先只做"编得过"的观察，红了不算回归失败（continue-on-error）
  macos:
    name: macos-universal (实验)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 编译（arm64 + x86_64 通用二进制）
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -arch arm64 -arch x86_64
          CFLAGS: -arch arm64 -arch x86_64
          LDFLAGS: -arch arm64 -arch x86_64
        run: make -f core/Makefile platform=osx -j"$(sysctl -n hw.ncpu)"

      - name: 检查
        run: |
          dylib=core/makecode_arcade_libretro.dylib
          lipo -info "$dylib"
          otool -L "$dylib" | tail -n +2

      - uses: actions/upload-artifact@v4
        with:
          name: osx-universal
          path: core/makecode_arcade_libretro.dylib
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- 打包
  # 用与本地发版同一个脚本（tools/package_release.sh）出 zip，
  # 方便验证"发行包结构"这条链路本身没坏
  package:
    name: package
    needs: [linux, windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: core/dist

      - name: 打成 RetroArch 发行包
        run: |
          tools/package_release.sh \
            x86_64-linux-gnu aarch64-linux-gnu arm-linux-gnueabihf \
            x86_64-windows-gnu \
            aarch64-linux-android21 armv7a-linux-androideabi21
          echo "== 产物 =="
          ls -l core/dist/release
          echo "== 各包清单 =="
          for z in core/dist/release/*.zip; do
            echo "-- $z"
            python3 -c "import sys,zipfile;print('   '+'\n   '.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$z"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: core/dist/release/*.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- 发版
  # 只在推 core-v* tag 时跑：把 zig（与本地发版矩阵同工具链、2.17 基线）
  # 和 NDK 的产物打成 7 个平台包，创建 GitHub Release 并上传。
  #
  # 为什么不复用上面的 package job：那个 job 吃的是发行版 gcc 产物，用途是
  # 验证"打包链路没坏"；发版包必须是 zig 2.17 基线（+ 只有 zig 才出的
  # windows-arm64），两者不能混。
  #
  # 凭据用仓库内置 GITHUB_TOKEN（job 级 contents: write），不需要 PAT ——
  # Release 对象和附件上传都只有 HTTPS API 有，git/SSH 到不了这一层。
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/core-v')
    needs: [zig, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      # artifact 名与 dist 目录名不一致：zig-<triple> 要去前缀，其余（linux/
      # android）本来就是 triple。download-artifact 只能按 artifact 名建目录，
      # 而同一个 .so 文件名在每个目录里重复，所以不能用 merge-multiple 摊平。
      - name: 归位到 core/dist
        run: |
          set -euo pipefail
          mkdir -p core/dist
          for d in art/*/; do
            name="$(basename "$d")"
            case "$name" in
              zig-*)      cp -r "$d" "core/dist/${name#zig-}" ;;
              *android*)  cp -r "$d" "core/dist/$name" ;;
            esac
          done
          ls -d core/dist/*/ | sed 's/^/  /'

      - name: 打发行包（7 平台）
        run: |
          set -euo pipefail
          tools/package_release.sh \
            x86_64-windows-gnu aarch64-windows-gnu \
            x86_64-linux-gnu.2.17 aarch64-linux-gnu.2.17 arm-linux-gnueabihf.2.17 \
            aarch64-linux-android21 armv7a-linux-androideabi21
          echo "== 产物 =="
          ls -l core/dist/release

      # 发版前的硬断言：少一个包、或 .info 版本与 tag 对不上，都别发出去
      - name: 校验发行包与 tag 一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#core-v}"
          n=$(ls core/dist/release/*.zip | wc -l)
          [ "$n" -eq 7 ] || { echo "::error::期望 7 个包，实际 $n"; exit 1; }
          for z in core/dist/release/*.zip; do
            got=$(python3 -c "import sys,zipfile,re;d=zipfile.ZipFile(sys.argv[1]).read('makecode_arcade_libretro.info').decode();print(re.search(r'display_version = \"([^\"]+)\"',d).group(1))" "$z")
            [ "$got" = "$ver" ] || { echo "::error file=$z::.info 版本 $got 与 tag $ver 不符"; exit 1; }
            echo "  $(basename "$z") -> $got"
          done

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          title="core ${tag#core-} - libretro core (7 platforms)"
          notes=".github/release-notes/${tag}.md"
          if [ -f "$notes" ]; then
            body=(--notes-file "$notes")
          else
            # 没写专属说明就退回自动生成（commit 列表），至少不是空正文
            body=(--generate-notes)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # 重跑（重推 tag / 手动 rerun）时更新而不是报错
            gh release upload "$tag" core/dist/release/*.zip --clobber
            gh release edit "$tag" --title "$title" "${body[@]}"
          else
            gh release create "$tag" core/dist/release/*.zip --title "$title" "${body[@]}"
          fi
          gh release view "$tag" --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + "  " + (.size|tostring) + " B")'
