# GitHub Actions：编译回归 + 可下载产物
#
# 分工（两个 CI 文件互不替代）：
#   .github/workflows/build.yml —— 本仓库自己的编译回归，每次 push / PR 跑，
#                                  产物是 workflow artifact（保留 30 天）
#   .gitlab-ci.yml             —— 给 libretro 官方 buildbot 收录用的 GitLab CI，
#                                  不在这里跑，官方镜像仓库时才会生效
#
# 工具链说明（重要）：两套 job 各管一半——
#   * 发行版工具链 job（gcc / mingw-w64 / Android NDK）：证明"源码在官方
#     buildbot 的构型下编得过"。**不要换成 zig**：工具链差异本身就是回归
#     价值（zig 的 mingw 头默认 _WIN32_WINNT=0x0a00，会藏住 GetTickCount64
#     这类问题，正是发行版 gcc 在 CI 上第一次抓出来的）。
#   * zig job：与本地发版矩阵（tools/build_matrix.sh）同一工具链、同一
#     版本、同一份 build_target.sh，验证发版构型在 CI 上可复现。发行版
#     工具链覆盖不了的两项也在这里补上：windows-arm64、glibc 2.17 基线断言。
#     Android 本地就是 NDK clang 编，由上面 android job 覆盖，无需 zig。
# 两边都绿 = 发版产物（本地 zig）与收录产物（发行版 gcc）都有回归兜底。
#
# 矩阵只列验证过能编过的平台（**全部 64 位**；32 位目标已整体移除，
# 原因见 README「只支持 64 位前端」）：
#   linux-x64 / linux-arm64（.so）
#   windows-x64（mingw-w64，.dll）
#   android arm64-v8a（ndk-build，见 core/jni/）
#   macOS 单独一个实验 job（continue-on-error，不阻塞）
#   zig：x64/arm64 Windows + Linux x64/arm64（基线 2.17）
#   lakka-musl：dockcross aarch64-musl 全静态 .so（Lakka 用，musl libc 例外不走 zig）
#   behavior-miniretro：真 aarch64 硬件 runner（ubuntu-24.04-arm，公开仓库
#     免费）上用第三方前端 miniretro 跑 900 帧冒烟 —— 行为层验证
#   golden-hash：末帧 MD5 比对（2 卡带 3 用例）—— 像素层验证，唯一能抓住
#     "契约全绿但画面画错了"的断言
#   pxt-patches：vendored pxt 树里的 9 个必要补丁是否还在（不编译，几秒）
#   package：把上面各 job 的产物打成发行包，再解包 dlopen 跑 60 帧

name: build

on:
  push:
    branches: [main]
    tags: ['core-v*']
    # 纯文档提交不必跑 18 个 job（md、docs/ 下的图与报告、LICENSE 都不进产物）。
    # 只要改动里有一个非忽略文件，整条 workflow 照常跑。
    #
    # 注意：paths-ignore 对 tag push 同样生效（GitHub 按"tag 指向的 commit 改了
    # 什么"来判），所以「只改 release-notes 想重发同一版」不会触发构建。那种
    # 情况用 workflow_dispatch 手动跑（不受 paths 过滤），release job 会走
    # `gh release upload --clobber` + `edit` 更新附件与正文。
    #
    # pull_request 故意不加：paths-ignore 跳过的 workflow 不产生 check，若分支
    # 保护把 build 列为必需项，只改文档的 PR 会永远卡在 "Expected"。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# 默认只读：回归 job 不改仓库内容。只有 release job（推 core-v* tag 时）
# 在 job 级申请 contents: write，用来建 Release 和上传附件。
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORENAME: makecode_arcade

jobs:
  # ------------------------------------------------------------------ Linux
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triple: x86_64-linux-gnu
            platform: unix
            cc: gcc
            cxx: g++
            apt: ''
          - arch: arm64
            triple: aarch64-linux-gnu
            platform: unix-aarch64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            apt: g++-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉工具链
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ${{ matrix.apt }}

      # CC/CXX 一律走环境变量：make 的命令行赋值会覆盖 Makefile 里的
      # `LDFLAGS += -shared`，导致 -shared 丢失（在 Windows 上表现为
      # lld-link: undefined symbol: WinMain）。环境变量是在 Makefile 的追加
      # 赋值之前生效，两者叠加。
      #
      # 链接参数刻意保持 gcc 默认：官方 buildbot 就是这么编的，加
      # -static-libstdc++ 反而可能在 x86_64 上撞 libstdc++.a 的
      # "relocation ... can not be used when making a shared object"。
      # 依赖 libstdc++.so.6 是 Linux core 的常态（RetroArch 自己也链它）。
      - name: 编译
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -f core/Makefile platform=${{ matrix.platform }} -j"$(nproc)"

      - name: 检查动态依赖
        run: |
          so=core/makecode_arcade_libretro.so
          file "$so"
          echo "== NEEDED =="
          readelf -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/  \1/p'
          echo "== GLIBC 符号版本（信息性） =="
          readelf -V "$so" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tr '\n' ' ' || true
          echo
          # 只允许常见系统库（libatomic 是历史遗留：32 位目标上 64 位原子操作
          # 可能带出来，如今已不构建 32 位，仍放行以免误报；ld-linux 是 zig
          # 链接器的习惯）：出现别的（静态链进来的 libc、libandroid 之类）
          # 说明链接方式跑偏，玩家机器上加载会失败
          bad=0
          for lib in $(readelf -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$lib" in
              libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*| \
              libstdc++.so.*|libgcc_s.so.*|libatomic.so.*|ld-linux*.so.*) ;;
              *) echo "::error file=core/Makefile::意外的动态依赖 $lib"; bad=1 ;;
            esac
          done
          [ "$bad" = 0 ] || exit 1

      - name: 归档
        run: |
          mkdir -p "core/dist/${{ matrix.triple }}"
          cp core/makecode_arcade_libretro.so "core/dist/${{ matrix.triple }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: core/dist/${{ matrix.triple }}/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Windows
  windows:
    name: windows-x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # pxt VM 用 pthread，必须 posix 线程模型（win32 变体没有 pthread.h）。
      # Ubuntu 的做法是 update-alternatives 在两个变体间切换，切完用不带
      # 后缀的名字即可（比直接写 -posix 后缀可靠：后缀名字随包版本变过）。
      #
      # 失败时把输出转成 ::error:: 注解：job 日志要鉴权才能下，注解在
      # 公开仓库上是可匿名读的，排查只靠它。
      - name: 安装 mingw-w64（posix 线程模型）
        run: |
          set -u
          out=$( (
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64-posix
            sudo update-alternatives --set x86_64-w64-mingw32-gcc \
                 /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ \
                 /usr/bin/x86_64-w64-mingw32-g++-posix
            x86_64-w64-mingw32-gcc --version | head -1
            x86_64-w64-mingw32-g++ --version | head -1
            ls -l /usr/x86_64-w64-mingw32/lib/libpthread* || true
          ) 2>&1 ) || {
            printf '%s\n' "$out" | tail -40
            printf '%s\n' "$out" | tail -40 | sed 's/^/::error::mingw /'
            exit 1
          }
          printf '%s\n' "$out" | tail -12

      - name: 编译
        env:
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          # 三个运行库全部静态链：分发出去的 DLL 不能依赖
          # libstdc++-6.dll / libgcc_s_seh-1.dll / libwinpthread-1.dll
          LDFLAGS: -static-libgcc -static-libstdc++
          # -Wl,-Bstatic 只作用于紧跟的 -lpthread（放行尾，符号已在前面的
          # 目标文件里出现，静态库才能被正确抽取）
          LDLIBS: -Wl,-Bstatic -lpthread -Wl,-Bdynamic
        run: |
          set -u
          log=out/ci-win64.log
          mkdir -p out
          # 输出重定向到文件而不是 $(...) 捕获：make 的命令回显走 stdout（管道
          # 下是块缓冲），编译错误走 stderr（无缓冲），捕获方式会把所有回显
          # 堆积到末尾，真正的错误行反而看不到
          if ! make -f core/Makefile platform=win64 -j"$(nproc)" > "$log" 2>&1; then
            first=$(grep -n -m1 'error:' "$log" | cut -d: -f1 || true)
            if [ -n "${first:-}" ]; then
              sed -n "$((first > 8 ? first - 8 : 1)),$((first + 4))p" "$log" \
                | sed 's/^/::error::win64 /'
            fi
            grep -E 'error:|undefined reference|cannot find|Error [0-9]' "$log" | head -20
            exit 1
          fi
          tail -5 "$log"

      - name: 检查导入表与导出符号
        run: |
          dll=core/makecode_arcade_libretro.dll
          echo "== 导入的 DLL =="
          x86_64-w64-mingw32-objdump -p "$dll" | grep -i 'DLL Name' | sort -u
          for bad in libstdc++-6.dll libgcc_s_seh-1.dll libgcc_s_dw2-1.dll libwinpthread-1.dll; do
            if x86_64-w64-mingw32-objdump -p "$dll" | grep -q "$bad"; then
              echo "::error file=core/Makefile::DLL 依赖 $bad，玩家机器上会加载失败"
              exit 1
            fi
          done
          # 导出符号是 libretro 的硬要求（--export-all-symbols 生效检查）
          for sym in retro_init retro_run retro_get_system_info retro_load_game; do
            x86_64-w64-mingw32-objdump -p "$dll" | grep -qw "$sym" \
              || { echo "::error::缺少导出符号 $sym"; exit 1; }
          done

      - name: 归档
        run: |
          mkdir -p core/dist/x86_64-windows-gnu
          cp core/makecode_arcade_libretro.dll core/dist/x86_64-windows-gnu/

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-windows-gnu
          path: core/dist/x86_64-windows-gnu/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Android
  # 只构建 arm64-v8a：32 位 ABI 已整体移除（PXT64 镜像在 32 位 VM 下跑不了，
  # 见 README「只支持 64 位前端」）。
  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android21
    steps:
      - uses: actions/checkout@v4

      - name: 定位 NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ ! -x "$NDK/ndk-build" ]; then
            echo "::error::找不到 ndk-build（\$ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME）"
            exit 1
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          sed -n 's/^Pkg.Revision *= *//p' "$NDK/source.properties" | head -1 | sed 's/^/NDK 版本: /'

      # 与官方 android-jni 模板同一套参数：APP_BUILD_SCRIPT / NDK_APPLICATION_MK
      # 明指 core/jni/，ABI 逐个覆盖；产物落 out/ 不污染源码树
      - name: 编译
        run: |
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=core/jni/Android.mk \
            NDK_APPLICATION_MK=core/jni/Application.mk \
            APP_ABI=${{ matrix.abi }} \
            NDK_OUT=out/ndk/obj NDK_LIBS_OUT=out/ndk/libs \
            -j"$(nproc)"

      - name: 检查 .so（16KB 页对齐 + 无 libc++_shared 依赖）
        run: |
          so="out/ndk/libs/${{ matrix.abi }}/libretro.so"
          ls -l "$so"
          echo "== NEEDED =="
          readelf -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/  \1/p'
          if readelf -d "$so" | grep -q 'libc++_shared'; then
            echo "::error file=core/jni/Application.mk::依赖 libc++_shared.so，APP_STL 应为 c++_static"
            exit 1
          fi
          # Android 15 起有 16KB 页设备，LOAD 段必须 0x4000 对齐
          echo "== LOAD 对齐 =="
          readelf -lW "$so" | awk '$1 == "LOAD" { print "  " $NF }' | sort -u
          if readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | grep -qv '^0x4000$'; then
            echo "::error file=core/jni/Android.mk::LOAD 段不是 16KB 对齐，16KB 页设备无法 dlopen"
            exit 1
          fi

      # 发行包里的 Android 产物叫 makecode_arcade_libretro.so（无 lib 前缀），
      # 与 package_release.sh 的 glob 对齐
      - name: 归档
        run: |
          mkdir -p "core/dist/${{ matrix.triple }}"
          cp "out/ndk/libs/${{ matrix.abi }}/libretro.so" \
             "core/dist/${{ matrix.triple }}/makecode_arcade_libretro.so"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: core/dist/${{ matrix.triple }}/*
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ zig
  # 与本地发版矩阵同工具链的一致性验证（分工见文件头注释）。
  # 版本号必须与本地保持同步：zig 升级可能改变 libc 基线与代码生成。
  zig:
    name: zig-${{ matrix.triple }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-windows-gnu
            ext: dll
            apt: ''
          - triple: aarch64-windows-gnu
            ext: dll
            apt: ''
          - triple: x86_64-linux-gnu.2.17
            ext: so
            apt: ''
          - triple: aarch64-linux-gnu.2.17
            ext: so
            apt: ''
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig 0.17.0（与本地发版矩阵同版本）
        run: |
          set -euo pipefail
          # set -e 的静默死法排查过两轮，加 ERR trap 兜底：任何未守护的失败
          # 都会带行号转成注解（job 日志要鉴权，注解可匿名读）
          trap 'echo "::error::zig 安装失败于第 $LINENO 行（exit=$?）"' ERR
          # mlugg/setup-zig 的版本索引对 0.17.0 返回 404，直接下载。
          # 0.14.1 起 tarball 命名是 arch 在前（zig-x86_64-linux-…）
          # 主源 ziglang.org（Cloudflare），回退 machengine 包镜像
          cd "$RUNNER_TEMP"
          ok=0
          for base in "https://ziglang.org/download/0.17.0" \
                      "https://pkg.machengine.org/zig"; do
            if curl -fsSLo zig.tar.xz "$base/zig-x86_64-linux-0.17.0.tar.xz" 2>curl.err; then
              if tar -tf zig.tar.xz >/dev/null 2>tar.err; then ok=1; break; fi
              # 拿到的不是 tar.xz（多半是拦截页），把内容特征转成注解排查
              echo "::error::$base 返回的不是合法 tar.xz：$(file -b zig.tar.xz | cut -c1-80)"
              head -c 120 zig.tar.xz | tr -c '[:print:]\n' '.' | sed 's/^/::error::  /'
            else
              echo "::error::$base 下载失败："
              tail -3 curl.err | sed 's/^/::error::  /'
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::所有源都取不到 zig 0.17.0"; exit 1; }
          # 内层目录名不猜，从 tarball 解析。注意不能写 `tar -tf | head -1`：
          # head 读一行就关管道，tar 写列表时吃 SIGPIPE 以 write error（2）退出，
          # 在 pipefail 下表现为静默 exit 2
          listing="$(tar -tf zig.tar.xz)"
          zigdir="${listing%%/*}"
          tar -xJf zig.tar.xz
          echo "$RUNNER_TEMP/$zigdir" >> "$GITHUB_PATH"
          # 断言拿到的就是发版用的版本，防止 URL 改版后静默装错。
          # 注意 $GITHUB_PATH 只对后续步骤生效，当前步骤要用显式路径
          v="$("$RUNNER_TEMP/$zigdir/zig" version)"
          [ "$v" = "0.17.0" ] || { echo "::error::zig 版本异常：实际 $v"; exit 1; }
          echo "zig $v -> $RUNNER_TEMP/$zigdir"

      - name: 安装 binutils（检查 PE 导入/导出表）
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ${{ matrix.apt }}

      - name: 编译
        run: |
          set -u
          log=out/ci-zig.log
          mkdir -p out
          # 与本地发版同一份脚本、同一组参数；ZIG 覆盖默认的 common tools 路径
          if ! ZIG=zig tools/build_target.sh ${{ matrix.triple }} > "$log" 2>&1; then
            first=$(grep -n -m1 'error:' "$log" | cut -d: -f1 || true)
            if [ -n "${first:-}" ]; then
              sed -n "$((first > 8 ? first - 8 : 1)),$((first + 4))p" "$log" \
                | sed 's/^/::error::zig ${{ matrix.triple }} /'
            fi
            grep -E 'error:|undefined reference|cannot find|Error [0-9]' "$log" | head -20
            exit 1
          fi
          tail -5 "$log"
          ls -l core/dist/${{ matrix.triple }}/

      - name: 检查产物
        run: |
          bin=core/dist/${{ matrix.triple }}/makecode_arcade_libretro.${{ matrix.ext }}
          case ${{ matrix.ext }} in
            so)
              file "$bin"
              echo "== NEEDED =="
              readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/  \1/p'
              # 发版基线钉在 2.17：出现更高版本的符号引用说明 zig 升级或
              # 链接方式变了，老掌机固件会加载失败——发行包的硬断言
              max=$(readelf -V "$bin" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)
              echo "GLIBC 最高符号版本: ${max:-无}"
              if [ -n "$max" ] && \
                 [ "$(printf '%s\n%s\n' "$max" GLIBC_2.17 | sort -V | tail -1)" != "GLIBC_2.17" ]; then
                echo "::error file=tools/build_target.sh::GLIBC 基线超出 2.17（$max），发版包会丢老系统"
                exit 1
              fi
              ;;
            dll)
              # 不能用 x86_64-w64-mingw32-objdump：它解不了 aarch64 PE 的导出表
              # （误报"缺少导出符号"，实际 25 个 retro_* 都在）。pefile 架构无关。
              pip install --quiet pefile
              python3 tools/check_pe.py "$bin"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: zig-${{ matrix.triple }}
          path: core/dist/${{ matrix.triple }}/*
          if-no-files-found: error
          retention-days: 30




  # ------------------------------------------- 独立前端交叉验证（miniretro）
  # miniretro（davidgfnet/miniretro）是第三方极简 CLI libretro 前端，专为
  # 自动化测试 core 设计。价值：自研 libretro_host.py 对 libretro API 的
  # 实现方式单一，偶然容忍的 core 端 API 误用（回调时序/像素格式假设等）
  # 换一个独立前端实现就可能暴露——相当于给 core 做第二次「前端方言」体检。
  # 在真实 aarch64 runner 上跑，与发版同构型。
  behavior-miniretro:
    name: behavior-miniretro
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig 0.17.0（aarch64-linux 本机版）
        run: |
          set -euo pipefail
          trap 'echo "::error::zig 安装失败于第 $LINENO 行（exit=$?）"' ERR
          cd "$RUNNER_TEMP"
          ok=0
          for base in "https://ziglang.org/download/0.17.0" \
                      "https://pkg.machengine.org/zig"; do
            if curl -fsSLo zig.tar.xz "$base/zig-aarch64-linux-0.17.0.tar.xz" 2>curl.err; then
              if tar -tf zig.tar.xz >/dev/null 2>tar.err; then ok=1; break; fi
              echo "::error::$base 返回的不是合法 tar.xz：$(file -b zig.tar.xz | cut -c1-80)"
            else
              echo "::error::$base 下载失败："
              tail -3 curl.err | sed 's/^/::error::  /'
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::所有源都取不到 zig 0.17.0"; exit 1; }
          listing="$(tar -tf zig.tar.xz)"
          zigdir="${listing%%/*}"
          tar -xJf zig.tar.xz
          echo "$RUNNER_TEMP/$zigdir" >> "$GITHUB_PATH"

      - name: 编译（与发版同构型）
        run: ZIG=zig tools/build_target.sh aarch64-linux-gnu.2.17

      - name: 编译 miniretro
        run: |
          git clone --depth 1 https://github.com/davidgfnet/miniretro
          make -C miniretro -j"$(nproc)"
          ./miniretro/miniretro --help 2>&1 | head -20 || true

      # 跑 900 帧（15 秒游戏时长），每 300 帧落一帧画面；core 不崩、
      # 有画面产出即算通过。作为独立前端，只做冒烟，不做逐帧比对
      # （像素格式/时序处理与自研宿主不同，哈希不可直接比）。
      # dump 输出目录 README 未定死，按"运行后新出现的 PNG"断言，不猜路径。
      - name: miniretro 加载 core 跑 900 帧
        run: |
          mkdir -p out/mr out/mr-system
          set +e
          # --output 是目录（截图写到 <dir>/screenshot%06u.png），不是文件前缀；
          # --dump-frames 接帧号列表。源码确认（miniretro.cc video_update）。
          ./miniretro/miniretro \
            --core core/dist/aarch64-linux-gnu.2.17/makecode_arcade_libretro.so \
            --rom tools/fixtures/ping.pxt64 \
            --output out/mr \
            --system out/mr-system \
            --frames 900 --dump-frames 300 600 900 \
            > miniretro.log 2>&1
          rc=$?
          set -e
          n=$(find out/mr -name '*.png' | wc -l)
          last=$(tail -3 miniretro.log | tr '\n' '|' | cut -c1-220)
          [ "$rc" -ne 0 ] && { echo "::error::miniretro rc=$rc last3: $last"; exit 1; }
          [ "$n" -ge 2 ] || { echo "::error::900 帧只产出 $n 帧画面 last3: $last"; exit 1; }
          echo "miniretro 冒烟通过：rc=0 pngs=$n"

  # ------------------------------------------------------- Lakka (musl)
  # Lakka / LibreELEC 系是 musl libc，glibc 动态 .so 加载不了；musl 目标
  # 不走本地 zig（zig 0.17 的 musl 静态库是 exe 专用非 PIC 版，见
  # tools/build_musl.sh 头注释），用 dockcross 的 aarch64-musl 镜像编全静态
  # .so——GNU ld `-shared -static`，与 libretro buildbot 的 Lakka core 同一
  # 构型（零 NEEDED、无 TEXTREL）。
  # 镜像选 Docker Hub（CDN 稳定）；musl.cc 源在 runner 上实测连不通。
  lakka-musl:
    name: lakka-musl (aarch64 全静态)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 编译（dockcross aarch64-musl 工具链）
        run: |
          set -u
          log="$RUNNER_TEMP/musl-build.log"
          docker run --rm \
            -v "$PWD":/work -w /work \
            dockcross/linux-arm64-musl:latest \
            bash -c 'echo "triplet: ${CC:-unset}"; bash tools/build_musl.sh' \
            > "$log" 2>&1 || true
          tail -8 "$log"
          # docker run 的退出码经重定向可能丢失，用自检输出兜底；
          # 失败时把日志尾部转成注解（公开可读，不需要鉴权下日志）
          if ! grep -q "自检通过" "$log"; then
            echo "::error::musl 构建未通过自检，关键输出（已滤 docker 拉取噪音）："
            key=$(grep -vE "Pull complete|Download complete|Verifying Checksum|Pulling fs layer|Already exists|Extracting|Waiting" "$log" | tail -25)
            printf '%s\n' "$key" | sed 's/^/::error::  /'
            exit 1
          fi

      - name: 检查产物（AArch64 + 零 NEEDED + 导出符号）
        run: |
          so=core/dist/aarch64-linux-musl/makecode_arcade_libretro.so
          file "$so" | grep -q "ELF 64-bit LSB .* ARM aarch64" \
            || { echo "::error::产物不是 aarch64 ELF"; file "$so"; exit 1; }
          n=$(readelf -d "$so" | grep -c NEEDED || true)
          [ "$n" = "0" ] || { echo "::error::NEEDED=$n，全静态失败"; exit 1; }
          for sym in retro_init retro_run retro_load_game retro_get_system_info; do
            readelf --dyn-syms -W "$so" | grep -qw "$sym" \
              || { echo "::error::缺少导出符号 $sym"; exit 1; }
          done
          echo "全静态 aarch64 DSO，NEEDED=0，导出符号齐全"

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-linux-musl
          path: core/dist/aarch64-linux-musl/makecode_arcade_libretro.so
          if-no-files-found: error
          retention-days: 30

  # miniretro 冒烟跑 musl 全静态产物：全静态 .so 与宿主 libc 无关，
  # glibc 系统的 dlopen 同样能加载（aarch64 机器码 + 零外部符号解析），
  # 等于在"换了一个 libc 的世界"里再验一遍 core 行为。
  behavior-miniretro-musl:
    name: behavior-miniretro (musl 全静态)
    needs: [lakka-musl]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aarch64-linux-musl
          path: out/musl

      - name: 编译 miniretro
        run: |
          git clone --depth 1 https://github.com/davidgfnet/miniretro
          make -C miniretro -j"$(nproc)"

      - name: miniretro 加载 musl core 跑 900 帧
        run: |
          mkdir -p out/mr out/mr-system
          set +e
          ./miniretro/miniretro \
            --core out/musl/makecode_arcade_libretro.so \
            --rom tools/fixtures/ping.pxt64 \
            --output out/mr \
            --system out/mr-system \
            --frames 900 --dump-frames 300 600 900 \
            > miniretro-musl.log 2>&1
          rc=$?
          set -e
          n=$(find out/mr -name '*.png' | wc -l)
          last=$(tail -3 miniretro-musl.log | tr '\n' '|' | cut -c1-220)
          [ "$rc" -ne 0 ] && { echo "::error::musl miniretro rc=$rc last3: $last"; exit 1; }
          [ "$n" -ge 2 ] || { echo "::error::900 帧只产出 $n 帧画面 last3: $last"; exit 1; }
          echo "musl core 冒烟通过：rc=0 pngs=$n"

  # ------------------------------------- Makefile 兼容性（buildbot 同路径）
  # libretro buildbot 用的是 core/Makefile + make + gcc 工具链，不是 zig。
  # 发版矩阵（zig）测不出 gcc 特有问题，收录前在这里按模板的真实调用方式
  # （make -C <path> -f Makefile platform=...）把每个平台编一遍：
  #   unix  ：ubuntu 系统 gcc（buildbot 镜像还老一档，gcc 只新不旧更严）
  #   win64 ：apt 的 mingw-w64 交叉包（buildbot 用 MXE 静态 gcc，同族）
  #   android：runner 预装 NDK 的 ndk-build，调 core/jni/Android.mk（arm64-v8a）
  makefile-compat:
    name: makefile-compat (buildbot 路径)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: platform=unix（系统 gcc）
        run: |
          set -euo pipefail
          make -C core -f Makefile platform=unix -j"$(nproc)"
          test -f core/makecode_arcade_libretro.so
          file -b core/makecode_arcade_libretro.so | grep -q x86-64

      # 契约自检（假前端）：不需要卡带。校验 system_info、像素格式协商时机、
      # descriptor/controller/variables 的终止哨兵、非 .pxt64 必须 load 失败。
      # 0.3.4 的 SET_CONTROLLER_INFO 缺哨兵就是"只有干净 gcc 才炸"，在这里
      # 能提前拦住，不必再等真机 SIGSEGV。
      - name: 契约自检（gcc/make 构型）
        run: make -C core -f Makefile platform=unix contract-test

      # UBSan 构型：同一套断言在 -fsanitize=undefined 下再跑一遍，对象落
      # 独立目录（build/make/unix-san-undefined；目录名带 sanitizer 名，
      # 否则 address 与 undefined 会复用彼此的 .o），与上面的普通构建互不覆盖。
      - name: 契约自检（UBSan 构型）
        run: make -C core -f Makefile platform=unix SANITIZE=undefined contract-test

      - name: platform=win64（mingw-w64 交叉）
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 > /dev/null
          mkdir -p out   # runner 上没有 out/，日志重定向必须先建目录
          # make 输出落文件：失败时错误行容易被缓冲挤出 tail，必须重定向再 grep
          # 注意 Actions 的 run 默认 bash -e：必须用 || rc=$? 挡住，否则 make
          # 一失败步骤立即中止（exit 2），走不到下面的注解诊断
          rc=0
          make -C core -f Makefile platform=win64 \
               CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
               -j"$(nproc)" > out/win64-build.log 2>&1 || rc=$?
          if [ $rc -ne 0 ] || [ ! -f core/makecode_arcade_libretro.dll ]; then
            echo "::error title=win64 make 失败 rc=$rc::"
            grep -n "error" out/win64-build.log | head -8 | \
              while IFS= read -r l; do echo "::error::${l:0:250}"; done
            tail -12 out/win64-build.log | \
              while IFS= read -r l; do echo "::error::tail| ${l:0:250}"; done
            exit 1
          fi
          file -b core/makecode_arcade_libretro.dll | grep -q PE32 || {
            echo "::error::产物不是 PE32"; exit 1; }

      # 模板语义：ndk-build -C <jni目录>，项目路径自动探测为父目录，
      # 产物 libretro.so（LOCAL_MODULE := retro）落在 <父>/libs/<ABI>/
      - name: android-jni（runner 预装 NDK，ndk-build）
        run: |
          set -u
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          [ -d "$ndk" ] || ndk="$(ls -d /usr/local/lib/android/ndk/* 2>/dev/null | tail -1)"
          if [ ! -d "$ndk" ]; then echo "::error::runner 上找不到 NDK"; exit 1; fi
          mkdir -p out/ndk
          # NDK_OUT/NDK_LIBS_OUT 必须绝对路径：-C core/jni 会切目录，相对路径
          # 会落到 core/jni/ 下面（bash -e 下 test 失败只给 exit 1，无声无息）
          rc=0
          "$ndk/ndk-build" --no-print-directory -C core/jni \
              APP_ABI=arm64-v8a \
              NDK_OUT="$PWD/out/ndk/obj" NDK_LIBS_OUT="$PWD/out/ndk/libs" \
              > out/ndk-build.log 2>&1 || rc=$?
          if [ $rc -ne 0 ] || [ ! -f out/ndk/libs/arm64-v8a/libretro.so ]; then
            echo "::error title=android ndk-build 失败 rc=$rc::"
            grep -n -i "error" out/ndk-build.log | head -8 | \
              while IFS= read -r l; do echo "::error::${l:0:250}"; done
            tail -12 out/ndk-build.log | \
              while IFS= read -r l; do echo "::error::tail| ${l:0:250}"; done
            exit 1
          fi
          file -b out/ndk/libs/arm64-v8a/libretro.so | grep -q aarch64 || {
            echo "::error::产物不是 aarch64"; exit 1; }
          git status --short core/ | grep -q . && {
            echo "::error::ndk-build 污染了源码树 core/"; git status --short core/; exit 1; } || true

      - uses: actions/upload-artifact@v4
        with:
          name: makefile-compat
          path: |
            core/makecode_arcade_libretro.so
            core/makecode_arcade_libretro.dll
          if-no-files-found: error
          retention-days: 10

  # --------------------------------------- vendored pxt 树的补丁完整性
  # runtime/pxtapp 是 vendored 的 pxt 运行时，9 个必要补丁直接落在源码里
  # （没有独立 patch 文件，构建时也不重放）。升级 pxt 时"重新生成这棵树"是
  # 最自然的动作，而补丁全消失后代码照样编得过、契约测试照样全绿——退化要
  # 到真机上换游戏才暴露，且是崩溃。这一步把隐形约束变成断言，5 秒成本。
  pxt-patches:
    name: pxt-patches
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 校验 11 个 pxt 上游补丁（--strict 还查未登记编号）
        run: python3 tools/check_pxt_patches.py --strict

  # --------------------------------------------------- 末帧哈希（golden hash）
  # 契约测试断言的是"API 用对了"；这里断言"画面还是那张画面"。VM 语义、渲染
  # 路径、输入映射任一处漂移，末帧 MD5 就变，而契约测试照样全绿——这是 CI 上
  # 唯一能抓住「游戏画错了」的断言。
  #
  # 基线 tools/fixtures/golden-frames.txt 只有 3 条（2 卡带 3 用例），各自盯一条
  # 不同链路：静态场景 / 纯色渲染 / 按键映射。多跑同构用例只会拖慢 CI。
  # 改核心后本地 `tools/ci_regress.sh <core> --record` 重生成，再手工确认
  # 「连跑两次结果相同」才提交——不稳定的基线比没有基线更坏。
  golden:
    name: golden-hash
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 编译（gcc/unix，与基线同构型）
        env:
          CC: gcc
          CXX: g++
        run: make -f core/Makefile platform=unix -j"$(nproc)"

      - name: 末帧哈希比对
        run: tools/ci_regress.sh core/makecode_arcade_libretro.so --bmp-dir out/ci_bmp

      # 失败时把三个用例的末帧都留下来：光看哈希只能知道"变了"，看 BMP 才知道
      # 变成什么样（黑屏 / 花屏 / 少一层 / 颜色错位，判断方向完全不同）
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-frames-bmp
          path: out/ci_bmp/*.bmp
          if-no-files-found: ignore
          retention-days: 14

  # ----------------------------------------------- RetroArch 真前端无头冒烟
  # golden hash 用的是自研 ctypes 宿主（tools/libretro_host.py），验的是"我们
  # 理解的契约"；RetroArch 验的是"真实前端怎么用它"：dlopen 路径、.info 解析、
  # SET_PIXEL_FORMAT 协商、SAVE_DIRECTORY、退出时的 dlclose —— 前者全测不到。
  #
  # 首次实跑（2026-11-09）就抓到"退出即 139"：pxt 运行时带 static 析构，
  # RetroArch 先 dlclose 再走 atexit 链，跳进已解除映射的代码段。现由链接期
  # `-Wl,-z,nodelete`（DF_1_NODELETE）解决，本 job 就是守这条线。
  #
  # 只跑 2 张夹具卡带（ping 静态场景 + probe 纯白场景），各 120 帧：
  # 真前端起停一次约 3 秒，多跑无收益。
  retroarch-smoke:
    name: retroarch-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig 0.17.0（x86_64-linux 本机版）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ok=0
          for base in "https://ziglang.org/download/0.17.0" \
                      "https://pkg.machengine.org/zig"; do
            if curl -fsSLo zig.tar.xz "$base/zig-x86_64-linux-0.17.0.tar.xz" 2>curl.err; then
              tar -tf zig.tar.xz >/dev/null 2>tar.err && { ok=1; break; }
              echo "::error::$base 返回的不是合法 tar.xz：$(file -b zig.tar.xz | cut -c1-80)"
            else
              echo "::error::$base 下载失败："
              tail -3 curl.err | sed 's/^/::error::  /'
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::所有源都取不到 zig 0.17.0"; exit 1; }
          listing="$(tar -tf zig.tar.xz)"
          zigdir="${listing%%/*}"
          tar -xJf zig.tar.xz
          echo "$RUNNER_TEMP/$zigdir" >> "$GITHUB_PATH"

      - name: 编译（与发版同构型）
        run: ZIG=zig tools/build_target.sh x86_64-linux-gnu.2.17

      # retroarch 走发行版包（24.04 = universe 1.19），不自己编：这个 job 要验的
      # 是"发行版前端怎么加载我们"，换成自编前端就失去意义。
      - name: 安装 retroarch / xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends retroarch xvfb xauth python3-pil
          retroarch --version | head -2

      # video/audio/input 全 null + 独立 HOME，不需要窗口也不需要声卡；
      # 退出码 0 / 有截图 / 日志里 Validation OK + SET_PIXEL_FORMAT + 160x120
      # 全部由脚本断言（含"退出即 139"这种只有真前端才暴露的失败）。
      - name: 无头加载夹具卡带各 120 帧
        run: xvfb-run -a tools/retroarch_smoke.sh --frames 120

  # ------------------------------------------------------------------ macOS
  # 实验：Makefile 支持 osx，但本机没有 macOS 工具链，作者未在真机验证过
  # 加载/音频；先只做"编得过"的观察，红了不算回归失败（continue-on-error）
  #
  # 镜像是 macos-15（Intel x64），不是 macos-14 —— 后者已于 2026-11-02 被
  # GitHub 整体退役，用它会得到 "The configuration 'macos-14-arm64-us-default'
  # is not supported"，job 一秒结束、runner_name 为空、steps 为 0，看起来像
  # 神秘失败，实际是机器借不到。
  # 注意 continue-on-error 的副作用：这种"借不到机器"的失败不会让 run 变红，
  # 会静默存在（本次就是退役 4 天后才被发现）。这个 job 红了要主动去看。
  # macos-15 同样有退役周期（GitHub 只保留最近两个大版本），届时按
  # https://github.com/actions/runner-images 的选举表迁移到 macos-latest。
  macos:
    name: macos-universal (实验)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 编译（arm64 + x86_64 通用二进制）
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -arch arm64 -arch x86_64
          CFLAGS: -arch arm64 -arch x86_64
          LDFLAGS: -arch arm64 -arch x86_64
        run: make -f core/Makefile platform=osx -j"$(sysctl -n hw.ncpu)"

      - name: 检查
        run: |
          dylib=core/makecode_arcade_libretro.dylib
          lipo -info "$dylib"
          otool -L "$dylib" | tail -n +2

      - uses: actions/upload-artifact@v4
        with:
          name: osx-universal
          path: core/makecode_arcade_libretro.dylib
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- 打包
  # 用与本地发版同一个脚本（tools/package_release.sh）出 zip，
  # 方便验证"发行包结构"这条链路本身没坏
  package:
    name: package
    needs: [linux, windows, android, lakka-musl]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 发行包要 strip（见 tools/package_release.sh 顶部说明）。x86_64 用宿主
      # 自带的 strip，aarch64 必须装交叉 binutils —— 宿主 binutils 是单目标
      # BFD，对 AArch64 ELF 直接报格式错误。
      - name: 安装交叉 binutils（strip 用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu

      - uses: actions/download-artifact@v4
        with:
          path: core/dist

      - name: 打成 RetroArch 发行包
        env:
          MCA_REQUIRE_STRIP: "1"
        run: |
          tools/package_release.sh \
            x86_64-linux-gnu aarch64-linux-gnu \
            x86_64-windows-gnu \
            aarch64-linux-android21 \
            aarch64-linux-musl
          echo "== 产物 =="
          ls -l core/dist/release
          echo "== 各包清单 =="
          for z in core/dist/release/*.zip; do
            echo "-- $z"
            python3 -c "import sys,zipfile;print('   '+'\n   '.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$z"
          done

      # 前面的 job 验的都是 core/dist 下的裸文件；这里验「玩家真正下载到的
      # zip 里那个 .so」。v0.3.1 的 Windows 包只装了 .pdb 就是这条链路漏出去
      # 的——包结构对、版本号对、二进制却不在。解包 -> dlopen -> load_game ->
      # 跑 60 帧，一步都不能少。
      - name: 发行包 dlopen 跑 60 帧（linux-x64）
        run: |
          set -euo pipefail
          z=$(ls core/dist/release/makecode_arcade_linux-x64.zip)
          rm -rf out/pkg && mkdir -p out/pkg
          unzip -o -q "$z" -d out/pkg
          so=$(find out/pkg -name 'makecode_arcade_libretro.so' | head -1)
          [ -n "$so" ] || { echo "::error file=$z::解包后没有 .so"; find out/pkg -type f; exit 1; }
          echo "包内核心：$so（$(stat -c%s "$so") 字节）"
          # 防回归：打包脚本必须真的 strip 过。曾经 5 MB 的带 .debug_* 的
          # 核心直接发出去，玩家多下 4 MB 无用数据，固件仓库也要求 strip 版。
          if readelf -S "$so" | grep -q '\.debug_info'; then
            echo "::error file=$z::发行包里的核心仍带 .debug_info，打包时没有 strip"
            exit 1
          fi
          # 退出码：2 缺符号 / 3 load_game 失败 / 4 帧循环异常，任一都算红
          python3 tools/libretro_host.py "$so" tools/fixtures/ping.pxt64 60 \
            --turbo --data-dir=out/pkg-data | tail -12

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: core/dist/release/*.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- 发版
  # 只在推 core-v* tag 时跑：把 zig（与本地发版矩阵同工具链、2.17 基线）
  # 和 NDK 的产物打成 5 个平台包（仅 64 位），创建 GitHub Release 并上传。
  #
  # 为什么不复用上面的 package job：那个 job 吃的是发行版 gcc 产物，用途是
  # 验证"打包链路没坏"；发版包必须是 zig 2.17 基线（+ 只有 zig 才出的
  # windows-arm64），两者不能混。
  #
  # 凭据用仓库内置 GITHUB_TOKEN（job 级 contents: write），不需要 PAT ——
  # Release 对象和附件上传都只有 HTTPS API 有，git/SSH 到不了这一层。
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/core-v')
    needs: [zig, android, lakka-musl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉 binutils（strip 用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu

      - uses: actions/download-artifact@v4
        with:
          path: art

      # artifact 名与 dist 目录名不一致：zig-<triple> 要去前缀，其余（linux/
      # android）本来就是 triple。download-artifact 只能按 artifact 名建目录，
      # 而同一个 .so 文件名在每个目录里重复，所以不能用 merge-multiple 摊平。
      - name: 归位到 core/dist
        run: |
          set -euo pipefail
          mkdir -p core/dist
          for d in art/*/; do
            name="$(basename "$d")"
            case "$name" in
              zig-*)      cp -r "$d" "core/dist/${name#zig-}" ;;
              *android*|*musl*) cp -r "$d" "core/dist/$name" ;;
            esac
          done
          ls -d core/dist/*/ | sed 's/^/  /'

      - name: 打发行包（6 平台，仅 64 位）
        env:
          MCA_REQUIRE_STRIP: "1"
        run: |
          set -euo pipefail
          # 只出 64 位包：32 位目标已整体移除（PXT64 镜像在 32 位 VM 下跑不了
          # 任何游戏，官方编译器也没有 32 位镜像输出，见 README）。
          tools/package_release.sh \
            x86_64-windows-gnu aarch64-windows-gnu \
            x86_64-linux-gnu.2.17 aarch64-linux-gnu.2.17 \
            aarch64-linux-android21 aarch64-linux-musl
          echo "== 产物 =="
          ls -l core/dist/release

      # 发版前的硬断言：少一个包、或 .info 版本与 tag 对不上，都别发出去
      - name: 校验发行包与 tag 一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#core-v}"
          # 主包 6 个；三个 ELF 平台（linux-x64/linux-arm64/lakka-arm64）各带
          # 一个 -debuginfo.zip。分开计数，数量不对就红。
          n_main=0; n_dbg=0
          for z in core/dist/release/*.zip; do
            case "$z" in
              *-debuginfo.zip) n_dbg=$((n_dbg + 1)) ;;
              *)               n_main=$((n_main + 1)) ;;
            esac
          done
          [ "$n_main" -eq 6 ] || { echo "::error::期望 6 个主包，实际 $n_main"; exit 1; }
          [ "$n_dbg" -eq 3 ] || { echo "::error::期望 3 个 debuginfo 包，实际 $n_dbg"; exit 1; }
          for z in core/dist/release/*.zip; do
            # debuginfo 包没有 .info（它只是符号原件），单独计数，别混进版本断言
            case "$z" in *-debuginfo.zip) continue ;; esac
            got=$(python3 -c "import sys,zipfile,re;d=zipfile.ZipFile(sys.argv[1]).read('makecode_arcade_libretro.info').decode();print(re.search(r'display_version = \"([^\"]+)\"',d).group(1))" "$z")
            [ "$got" = "$ver" ] || { echo "::error file=$z::.info 版本 $got 与 tag $ver 不符"; exit 1; }
            # 包里必须真有一个可加载的核心二进制：只校验版本/数量曾经放过了
            # v0.3.1 的 Windows 包（只有 .pdb、没有 .dll），玩家装不上才发现。
            # 用单行 -c 而不是 heredoc：heredoc 正文顶到第 0 列会截断 YAML 块
            python3 -c "import sys,zipfile;n=zipfile.ZipFile(sys.argv[1]).namelist();ok=[x for x in n if x in ('makecode_arcade_libretro.dll','makecode_arcade_libretro.so','makecode_arcade_libretro.dylib')];sys.exit(0 if ok else f'包里没有核心二进制，实际内容 {n}')" "$z" \
              || { echo "::error file=$z::包里没有核心二进制"; exit 1; }
            echo "  $(basename "$z") -> $got"
          done

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          title="core ${tag#core-} - libretro core (6 platforms, 64-bit)"
          notes=".github/release-notes/${tag}.md"
          if [ -f "$notes" ]; then
            body=(--notes-file "$notes")
          else
            # 没写专属说明就退回自动生成（commit 列表），至少不是空正文
            body=(--generate-notes)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # 重跑（重推 tag / 手动 rerun）时更新而不是报错
            gh release upload "$tag" core/dist/release/*.zip --clobber
            gh release edit "$tag" --title "$title" "${body[@]}"
          else
            gh release create "$tag" core/dist/release/*.zip --title "$title" "${body[@]}"
          fi
          gh release view "$tag" --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + "  " + (.size|tostring) + " B")'
